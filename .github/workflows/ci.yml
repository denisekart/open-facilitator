name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          cache: true
          # setup-dotnet's cache resolves lock files from the repo root and
          # errors "Dependencies lock file is not found" when none is there;
          # this repo commits one packages.lock.json per project (CPM stays
          # the version authority), so point the glob at them explicitly.
          cache-dependency-path: "**/packages.lock.json"
      # 2026-11-02: restore-time enforcement of the committed lock graphs —
      # drift against Directory.Packages.props fails the restore instead of
      # silently rewriting the lock files during the build's implicit restore.
      - run: dotnet restore OpenFacilitator.slnx --locked-mode
      - run: dotnet build OpenFacilitator.slnx -c Release --no-restore
      # Kernel suite only: the browser tier runs in `admin-e2e` (chromium-provisioned).
      - run: dotnet test tests/Facilitator.Tests/Facilitator.Tests.csproj -c Release --no-build -- --blame-hang-timeout 2m
      - name: conformance fixtures (.NET harness)
        run: dotnet run --project protocol/tools/Validate.Fixtures -c Release

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm -r build
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r test

  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: codegen drift gate
        run: |
          pnpm protocol:codegen
          git diff --exit-code -- src/protocol/src/generated protocol/dotnet/Ofac.Protocol/Generated src/protocol/schemas
      - name: openapi stub validates
        run: |
          npx swagger-cli validate protocol/openapi/link-v1.yaml
          npx swagger-cli validate protocol/openapi/admin-v1.yaml

  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: agents docs drift gate
        run: node protocol/tools/agents-docs-check.mjs
      - name: actionlint
        run: docker run --rm -v "$PWD:/work" -w /work rhysd/actionlint:latest
      - name: yamllint
        run: |
          pip install yamllint
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" .github
      - name: versions.env completeness
        run: |
          missing=0
          for key in POSTGRES_TAG KEYCLOAK_TAG KAFKA_TAG FORGEJO_TAG MATTERMOST_TAG SEAWEEDFS_TAG ASPIRE_TAG OLLAMA_TAG AWSCLI_TAG OCI_REGISTRY FRAMEWORK_TAG POSTGRES_DIGEST KEYCLOAK_DIGEST KAFKA_DIGEST FORGEJO_DIGEST MATTERMOST_DIGEST SEAWEEDFS_DIGEST ASPIRE_DIGEST OLLAMA_DIGEST FACILITATOR_DIGEST RUNTIME_DIGEST; do
            grep -q "^${key}=" reference/versions.env || { echo "missing ${key}"; missing=1; }
          done
          exit $missing

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t facilitator:ci -f src/facilitator/Dockerfile .
      - run: docker build -t node-runtime:ci -f Dockerfile.node .

