name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          cache: true
      - run: dotnet build OpenFacilitator.slnx -c Release
      - run: dotnet test OpenFacilitator.slnx -c Release --no-build -- --blame-hang-timeout 2m
      - name: conformance fixtures (.NET harness)
        run: dotnet run --project protocol/tools/Validate.Fixtures -c Release

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm -r build
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r test

  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: codegen drift gate
        run: |
          pnpm protocol:codegen
          git diff --exit-code -- src/protocol/src/generated protocol/dotnet/Ofac.Protocol/Generated src/protocol/schemas
      - name: openapi stub validates
        run: npx swagger-cli validate protocol/openapi/link-v1.yaml

  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: agents docs drift gate
        run: node protocol/tools/agents-docs-check.mjs
      - name: actionlint
        run: docker run --rm -v "$PWD:/work" -w /work rhysd/actionlint:latest
      - name: yamllint
        run: |
          pip install yamllint
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" .github
      - name: versions.env completeness
        run: |
          missing=0
          for key in POSTGRES_TAG KEYCLOAK_TAG KAFKA_TAG FORGEJO_TAG MATTERMOST_TAG SEAWEEDFS_TAG ASPIRE_TAG OLLAMA_TAG OCI_REGISTRY FACILITATOR_DIGEST; do
            grep -q "^${key}=" reference/versions.env || { echo "missing ${key}"; missing=1; }
          done
          exit $missing

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t facilitator:ci -f src/facilitator/Dockerfile .

  link-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: build Facilitator (the e2e harness spawns its own server per file)
        run: dotnet build src/facilitator -c Release
      - name: workspace link e2e
        env:
          # Gate URL only: each e2e file boots its OWN Facilitator on an
          # OS-assigned port (lease-epoch timing determinism), so the gate
          # value never gets dialed.
          FACILITATOR_URL: http://gate-only
          FACILITATOR_PG: postgresql://postgres:postgres@localhost:5432/postgres
        run: pnpm -C src/workspace-link test:e2e

  gateway-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: build Facilitator (the e2e harness spawns its own server per file)
        run: dotnet build src/facilitator -c Release
      - name: gateway e2e
        env:
          # Gate URL only: each e2e file boots its OWN Facilitator on an
          # OS-assigned port (lease-epoch timing determinism), so the gate
          # value never gets dialed.
          FACILITATOR_URL: http://gate-only
          FACILITATOR_PG: postgresql://postgres:postgres@localhost:5432/postgres
        run: pnpm -C src/gateway test:e2e
      - name: harness worker e2e (plan 07 deterministic worker vs standalone gateway)
        env:
          FACILITATOR_URL: http://gate-only
          FACILITATOR_PG: postgresql://postgres:postgres@localhost:5432/postgres
        run: pnpm -C src/adapters/harnesses/deterministic test:e2e
