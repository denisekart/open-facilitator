  conformance:
    # The conformance package against a live slim stack: the .NET runner's
    # item 1-5 scenarios + the foreign-shape link client's two-phase
    # lifecycle, with the JSON report kept as an artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          cache: true
          # locks live per-project, none at repo root (see dotnet job)
          cache-dependency-path: "**/packages.lock.json"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C protocol/tools/link-client-foreign build
      - run: dotnet build protocol/tools/Conformance.Runner -c Release
      - name: boot slim stack
        run: ./referencectl up slim --no-seed
      - name: runner + foreign client against the live kernel
        run: |
          dotnet protocol/tools/Conformance.Runner/bin/Release/net10.0/Conformance.Runner.dll \
            --kernel-url http://localhost:8088 --idp-url http://localhost:8080 \
            --realm facilitator --username alice --password alice \
            --enrollment-token "$(grep '^DEMO_ENROLLMENT_TOKEN=' reference/.env | cut -d= -f2)" \
            --link-client "node ${GITHUB_WORKSPACE}/protocol/tools/link-client-foreign/dist/src/main.js" \
            --out conformance-report.json
      - name: upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: conformance-report.json

  link-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          cache: true
          # locks live per-project, none at repo root (see dotnet job)
          cache-dependency-path: "**/packages.lock.json"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: build Facilitator (the e2e harness spawns its own server per file)
        run: dotnet build src/facilitator -c Release
      - name: start Keycloak (identity IdP for kernel bearers)
        run: |
          docker run -d --name idp -p 8480:8080 \
            -v "$GITHUB_WORKSPACE/reference/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro" \
            "quay.io/keycloak/keycloak:$(grep '^KEYCLOAK_TAG=' reference/versions.env | cut -d= -f2)" \
            start-dev --import-realm
          for _ in $(seq 1 90); do
            curl -sf http://localhost:8480/realms/facilitator/.well-known/openid-configuration >/dev/null && exit 0; sleep 1
          done; docker logs idp; exit 1
      - name: workspace link e2e
        env:
          # Gate URL only: each e2e file boots its OWN Facilitator on an
          # OS-assigned port (lease-epoch timing determinism), so the gate
          # value never gets dialed.
          FACILITATOR_URL: http://gate-only
          FACILITATOR_PG: postgresql://postgres:postgres@localhost:5432/postgres
          KEYCLOAK_URL: http://localhost:8480
        run: pnpm -C src/workspace-link test:e2e

  gateway-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          cache: true
          # locks live per-project, none at repo root (see dotnet job)
          cache-dependency-path: "**/packages.lock.json"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: build Facilitator (the e2e harness spawns its own server per file)
        run: dotnet build src/facilitator -c Release
      - name: start Keycloak (identity IdP for kernel bearers)
        run: |
          docker run -d --name idp -p 8480:8080 \
            -v "$GITHUB_WORKSPACE/reference/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro" \
            "quay.io/keycloak/keycloak:$(grep '^KEYCLOAK_TAG=' reference/versions.env | cut -d= -f2)" \
            start-dev --import-realm
          for _ in $(seq 1 90); do
            curl -sf http://localhost:8480/realms/facilitator/.well-known/openid-configuration >/dev/null && exit 0; sleep 1
          done; docker logs idp; exit 1
      - name: gateway e2e
        env:
          # Gate URL only: each e2e file boots its OWN Facilitator on an
          # OS-assigned port (lease-epoch timing determinism), so the gate
          # value never gets dialed.
          FACILITATOR_URL: http://gate-only
          FACILITATOR_PG: postgresql://postgres:postgres@localhost:5432/postgres
          KEYCLOAK_URL: http://localhost:8480
        run: pnpm -C src/gateway test:e2e
      - name: harness worker e2e (plan 07 deterministic worker vs standalone gateway)
        env:
          FACILITATOR_URL: http://gate-only
          FACILITATOR_PG: postgresql://postgres:postgres@localhost:5432/postgres
          KEYCLOAK_URL: http://localhost:8480
        run: pnpm -C src/adapters/harnesses/deterministic test:e2e

  admin-e2e:
    # Browser tier (plan 21): the embedded SPA against a real-Kestrel kernel.
    # Postgres + Keycloak ride in as Testcontainers inside the linked
    # fixtures, so this job needs only the runner's Docker plus chromium.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-dotnet@v6
        with:
          cache: true
          # locks live per-project, none at repo root (see dotnet job)
          cache-dependency-path: "**/packages.lock.json"
      - run: pnpm install --frozen-lockfile
      - name: build SPA (stages wwwroot before the kernel build embeds it)
        run: pnpm -r build
      - run: dotnet restore OpenFacilitator.slnx --locked-mode
      - run: dotnet build OpenFacilitator.slnx -c Release --no-restore
      - name: install chromium
        run: node tests/Facilitator.E2E/bin/Release/net10.0/.playwright/package/cli.js install --with-deps chromium
      - name: admin inspector e2e
        run: dotnet test tests/Facilitator.E2E -c Release --no-build

  features:
    # Feature install contract on both arches: unit-test each
    # Feature in isolated containers, plus a combo scenario proving the
    # supervisor/unit composition and install idempotency.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 2026-11-02: pinned to 24.04 both legs. ubuntu-latest migrated to
        # Ubuntu 26 on 2026-10-19 and this job's hosted scenario runs began
        # failing (exit 1) on the migrated runner layer; the Feature install
        # payloads themselves are distro-agnostic (no apt in install.sh; all
        # six scenarios verified green locally on 2026-11-02 against the
        # ubuntu:26.04 + debian scenario base images, arm64).
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build runtime payloads
        run: node features/build.mjs
      - name: feature unit tests (ubuntu + debian, combo on gateway)
        run: |
          # 2026-11-02: exact pin. The old `^0.79` range floated to every new
          # minor untested (0.90.0 landed 2026-10), so the job's green state
          # was a moving target; 0.90.0 is verified locally across all six
          # scenarios (ubuntu+debian per feature, combo on gateway).
          npx --yes @devcontainers/cli@0.90.0 features test -p features \
            -f gateway -f workspace-link -f harness-adapter \
            --skip-autogenerated --skip-duplicated

  example-smoke:
    # The composed example end-to-end: host-mode Facilitator + devcontainer
    # with all three Features; seeded assignment must complete into inbox.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          cache: true
          # locks live per-project, none at repo root (see dotnet job)
          cache-dependency-path: "**/packages.lock.json"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build runtime payloads
        run: node features/build.mjs
      - name: build Facilitator
        run: dotnet build src/facilitator -c Release
      - name: start Keycloak (identity IdP for kernel bearers)
        run: |
          docker run -d --name idp -p 8480:8080 \
            -v "$GITHUB_WORKSPACE/reference/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro" \
            "quay.io/keycloak/keycloak:$(grep '^KEYCLOAK_TAG=' reference/versions.env | cut -d= -f2)" \
            start-dev --import-realm
          for _ in $(seq 1 90); do
            curl -sf http://localhost:8480/realms/facilitator/.well-known/openid-configuration >/dev/null && exit 0; sleep 1
          done; docker logs idp; exit 1
      - name: boot Facilitator (Development mode, OIDC + enroll-dev)
        run: |
          ASPNETCORE_ENVIRONMENT=Development \
          ASPNETCORE_URLS=http://0.0.0.0:8088 \
          ConnectionStrings__Facilitator="Host=localhost;Database=postgres;Username=postgres;Password=postgres" \
          Identity__Oidc__Authority=http://localhost:8480/realms/facilitator \
          Identity__Oidc__Audience=facilitator-api \
          Identity__Oidc__RequireHttps=false \
          nohup dotnet run --project src/facilitator -c Release --no-build > /tmp/kernel.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8088/health >/dev/null && exit 0; sleep 1
          done; tail -20 /tmp/kernel.log; exit 1
      - name: devcontainer up
        run: npx --yes @devcontainers/cli@^0.79 up --workspace-folder examples/slim/deterministic-research-worker
      - name: supervisors reach ready
        run: |
          W=examples/slim/deterministic-research-worker
          for u in 10-gateway.sh 30-harness-adapter.sh 20-linkd.sh; do
            for _ in $(seq 1 60); do
              npx --yes @devcontainers/cli@^0.79 exec --workspace-folder $W \
                sh -c "grep -q ready /workspace/.ofac-logs/$u.log" && break; sleep 2
            done
            npx --yes @devcontainers/cli@^0.79 exec --workspace-folder $W \
              grep -q ready /workspace/.ofac-logs/$u.log || { echo "no ready line in $u"; tail -5 /tmp/kernel.log; exit 1; }
          done
      - name: seed assignment + verify completion
        run: |
          W=examples/slim/deterministic-research-worker
          KERNEL_TOKEN=$(curl -sf http://localhost:8480/realms/facilitator/protocol/openid-connect/token \
            -d grant_type=client_credentials -d client_id=facilitator-cli -d client_secret=e2e-cli-secret | jq -r .access_token)
          curl -sf -X POST localhost:8088/api/dev/link-outbox \
            -H "Authorization: Bearer $KERNEL_TOKEN" -H 'Content-Type: application/json' \
            -d "{\"endpointId\":\"gw.demo\",\"envelope\":{\"specversion\":\"1.0\",\"id\":\"ci-cmd-1\",\"source\":\"urn:facilitator:instance:demo\",\"type\":\"org.facilitator.command.work.assign.v1\",\"subject\":\"work/work-ci-1/assignment/asg-ci-1\",\"time\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"datacontenttype\":\"application/json\",\"dataschema\":\"https://schemas.openfacilitator.org/v1/command.work.assign.v1.json\",\"data\":{\"commandId\":\"ci-cmd-1\",\"actorEvidenceRef\":\"identity-evidence:demo\",\"workId\":\"work-ci-1\",\"targetId\":\"demo\",\"capabilityId\":\"research.analyze\",\"expectedContextVersion\":1,\"inputs\":{\"objective\":\"cost model\",\"sourceRefs\":[]},\"expectedDeliverables\":[{\"kind\":\"analysis.report\",\"mediaType\":\"text/markdown\"}],\"deadline\":\"2036-10-23T18:00:00Z\",\"assignmentId\":\"asg-ci-1\"}}}"
          for _ in $(seq 1 30); do
            PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -tA -c \
              "SELECT 1 FROM facilitator.inbox WHERE payload->>'type' = 'org.facilitator.event.assignment.completed.v1'" | grep -q 1 && break; sleep 2
          done
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -tA -c \
            "SELECT 1 FROM facilitator.inbox WHERE payload->>'type' = 'org.facilitator.event.assignment.completed.v1'" | grep -q 1
          npx --yes @devcontainers/cli@^0.79 exec --workspace-folder $W \
            sh -c "curl -s 127.0.0.1:8099/status | jq -e '.children[] | select(.state==\"connected\")'"
