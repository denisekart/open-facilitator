name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to pin digests for (digest-pin job only)
        default: latest

jobs:
  containers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: src/facilitator/Dockerfile
          tags: |
            ghcr.io/denisekart/open-facilitator/facilitator:${{ github.ref_name }}
            ghcr.io/denisekart/open-facilitator/facilitator:latest
          platforms: linux/amd64,linux/arm64
          push: true
      # Source-built Node runtime (gateway/linkd/worker in one image).
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.node
          tags: |
            ghcr.io/denisekart/open-facilitator/node-runtime:${{ github.ref_name }}
            ghcr.io/denisekart/open-facilitator/node-runtime:latest
          platforms: linux/amd64,linux/arm64
          push: true

  # Dev Container Features (OCI distribution): each features/src/<name>
  # publishes as an OCI image under …/features/<name>, tagged with the
  # feature version + major. Payload tarballs are built from source, so the
  # install layer needs no npm registry.
  features:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: build runtime payloads
        run: node features/build.mjs
      - name: publish features
        run: |
          npx --yes @devcontainers/cli@^0.79 features publish \
            --registry ghcr.io --namespace denisekart/open-facilitator/features features/src
      # Major tag (:1) per feature — consumers pin majors, not full versions.
      - name: tag majors
        run: |
          for name in gateway workspace-link harness-adapter omp-adapter codex-adapter forgejo-provider; do
            docker buildx imagetools create \
              -t ghcr.io/denisekart/open-facilitator/features/$name:1 \
              ghcr.io/denisekart/open-facilitator/features/$name:1.0.0
          done

  # npm publish (npmjs.org, @ofac scope, OIDC trusted publisher — no token):
  # every package that ships flips private:false + a real version; the tag
  # stamps its version. Enable with the ENABLE_NPM_PUBLISH repo variable and
  # register this workflow as the package's trusted publisher on npmjs.
  # The publish set is a CLOSURE (tools/npm/publishable-packages.mjs): a
  # workspace dep of a published package MUST itself be published, or the
  # released tarball resolves to nothing — the tool derives the set from the
  # dependency graph (deps before dependents) and fails loudly when a dep
  # falls outside it, instead of trusting a flag scan to stay complete.
  publish-npm:
    if: ${{ vars.ENABLE_NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm publish --provenance (trusted publisher, npm 9+)
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: build + publish publishable packages
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          # Dependency-ordered publishable set (deps before dependents).
          # Stamp the tag's version + build, then publish package by package
          # (a bulk `pnpm -r publish` also visits private packages whose
          # version never moved, and one already-published version fails the
          # whole batch).
          mapfile -t dirs < <(node tools/npm/publishable-packages.mjs)
          [ "${#dirs[@]}" -gt 0 ] || { echo "nothing publishable"; exit 1; }
          for dir in "${dirs[@]}"; do
            npm pkg set version="$tag" -C "$dir"
            pnpm --dir "$dir" build
            pnpm --dir "$dir" publish --no-git-checks --access public --provenance
          done

  # SBOM for every shipped artifact, attached to the GitHub release:
  # dotnet-CycloneDX over the .NET solution + pnpm's native SBOM generator
  # over the workspace lockfile. Both analyze the dependency graph, no execution.
  sbom:
    needs: containers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          cache: true
          # locks live per-project, none at repo root (see the CI dotnet job)
          cache-dependency-path: "**/packages.lock.json"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: dotnet tool install --global CycloneDX
      - run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      # the tool's verb is `dotnet-CycloneDX` (no `dotnet sbom` verb exists);
      # it restores the graph itself, so no separate restore/build step.
      - name: .NET solution SBOM
        run: dotnet-CycloneDX OpenFacilitator.slnx --output sbom-dotnet --filename sbom.cdx.json
      # pnpm 12's own generator: the CycloneDX npm tool shells out to `npm ls`,
      # which cannot walk a pnpm workspace. --lockfile-only reads the lockfile
      # directly (no install, no store), emitting one CycloneDX doc for the
      # whole workspace.
      - name: pnpm workspace SBOM
        run: pnpm sbom --sbom-format cyclonedx --lockfile-only --out sbom-npm.cdx.json
      - name: attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            sbom-dotnet/sbom.cdx.json
            sbom-npm.cdx.json

  # Digest pins: resolve the immutable digests of the images the reference
  # environment pulls — both source-built images the containers job pushes
  # (tag `latest` stands in on workflow_dispatch) and every third-party image
  # versions.env pins — and write the *_DIGEST keys back to versions.env.
  # compose.slim.yaml consumes FACILITATOR_DIGEST as an @digest image ref
  # when set, :tag when empty, so local builds keep working. The commit-back
  # runs only when a value actually changed (git diff guard).
  digest-pin:
    needs: containers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: rewrite *_DIGEST keys
        run: |
          set -euo pipefail
          # Tags come from versions.env itself — one source for "what we run".
          set -a; . reference/versions.env; set +a
          pin() { # key image
            local d
            d=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$2")
            [ -n "$d" ] && sed -i "s|^$1=.*|$1=$d|" reference/versions.env
          }
          tag="${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"
          pin FACILITATOR_DIGEST ghcr.io/denisekart/open-facilitator/facilitator:${tag}
          pin RUNTIME_DIGEST ghcr.io/denisekart/open-facilitator/node-runtime:${tag}
          pin POSTGRES_DIGEST postgres:${POSTGRES_TAG}
          pin KEYCLOAK_DIGEST quay.io/keycloak/keycloak:${KEYCLOAK_TAG}
          pin KAFKA_DIGEST apache/kafka:${KAFKA_TAG}
          pin FORGEJO_DIGEST codeberg.org/forgejo/forgejo:${FORGEJO_TAG}
          pin MATTERMOST_DIGEST mattermost/mattermost-team-edition:${MATTERMOST_TAG}
          pin SEAWEEDFS_DIGEST chrislusf/seaweedfs:${SEAWEEDFS_TAG}
          pin ASPIRE_DIGEST mcr.microsoft.com/dotnet/aspire-dashboard:${ASPIRE_TAG}
          pin OLLAMA_DIGEST ollama/ollama:${OLLAMA_TAG}
      - name: commit changed pins
        run: |
          set -euo pipefail
          git diff --quiet reference/versions.env && { echo "no digest changes"; exit 0; }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reference/versions.env
          git commit -m "release: digest pins ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"
          git push
