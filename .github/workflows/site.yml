name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Single deploy at a time; PRs only build.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Custom domains serve the site at the root; project pages at /<repo>/.
      # Drop this override if the Pages settings switch to a project path.
      OFAC_SITE_BASE: /
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: install site dependencies
        run: npm ci --prefix site --no-audit --no-fund
      - name: build
        run: npm run --prefix site build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
