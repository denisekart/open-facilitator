<text x="24" y="596" font-size="11" font-weight="400" fill="#505a69">Compact ≤720px: drop the wordmark, hints, and chip words. Tap targets reach 44px on an invisible pseudo-box, so the painted layout never moves.</text>
<text x="24" y="614" font-size="11" font-weight="400" fill="#505a69">Density is a dial, not a default: 30px data rows, 44px touch rows, 76px of chrome total. On a 900px viewport, 88% holds content.</text>
