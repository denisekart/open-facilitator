# Standalone Gateway for the deterministic-worker walkthrough.
# `children: []`: the fleet listener boots on ./child.sock and waits — the
# worker attaches itself (Plan 07's spawn-before-Gateway restart law covers
# either order). `team` must match the kernel's enrollment team slug.
apiVersion: facilitator.framework/v1
kind: Gateway
gatewayId: gw.demo
team: default
facilitatorUrl: http://localhost:8088
enrollmentSecret: enroll-dev
trustMode: isolated-executor
stateDir: ./.ofac-gateway
mode: standalone
children: []
childTransport:
  socket:
    path: ./child.sock
diagnostics:
  port: 8099
heartbeatSeconds: 5
