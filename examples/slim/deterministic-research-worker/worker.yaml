# Deterministic worker for the walkthrough. Relative paths resolve against
# this file's directory. `token` must equal the Gateway's OFAC_CHILD_SECRET
# (start the Gateway with that env set — see README).
apiVersion: facilitator.framework/v1
kind: HarnessAdapter
childWorkspaceId: gw.demo/deterministic
token: child-secret-demo
transport:
  socket:
    path: .ofac-gateway/child.sock
manifestFile: capabilities.yaml
workDir: ./.ofac-worker
stepMs: 800
heartbeatSeconds: 5
restartBackoffMs: [100, 250, 500, 1000, 2000, 5000]
