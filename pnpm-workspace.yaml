packages:
  - "src/otel"
  - "src/gateway"
  - "src/adapters/harnesses/adapter-sdk"
  - "src/adapters/harnesses/cli"
  - "examples/custom-hooks-worker"
  - "src/adapters/harnesses/omp"
  - "src/adapters/harnesses/codex"
  - "src/protocol"
  - "src/workspace-link"
  - "src/facilitator/ui"
  - "src/adapters/provider-core"
  - "src/adapters/communication/mattermost"
  - "src/adapters/communication/telegram"
  - "src/adapters/communication/forgejo"
  - "src/adapters/communication/forgejo-connector"
  - "src/adapters/communication/github"
  - "src/adapters/communication/github-connector"
  - "src/adapters/communication/gitlab"
  - "src/adapters/communication/gitlab-connector"
  - "src/adapters/provisioning-oci"
  - "examples/aws"
  - "examples/aws/fleet-launcher"
  - "examples/full/coding-worker"
  - "examples/local/tools/localctl"
  - "protocol/tools/link-client-foreign"
  - "tools/scenario-plane"

allowBuilds:
  better-sqlite3: false
  esbuild: true
  # node-pty (the cli harness's opt-in PTY legs) needs its node-gyp install
  # script: the helper spawn talks to a real terminal, no prebuilt binding
  # ships. PTY stays opt-in — pipes never import node-pty at runtime.
  node-pty: true
  # better-sqlite3 13 is deliberately NOT allow-built: its published install
  # script (`node-gyp rebuild`) needs node-gyp + a SQLite source download,
  # while the tarball ships prebuilds/ for linux+darwin+win x64/arm64 that
  # lib/binding.js loads directly. Skipping the script uses the prebuild.

catalog:
  # versions resolved by `pnpm add -Dw` (Plan 00 Step 3). TS 6.x: tsup 9 and
  # typescript-eslint 8 do not support the TypeScript 7 native compiler yet.
  typescript: "^6.0.3"
  tsup: "^9.0.0"
  vitest: "^5.0.5"
  # Coverage provider for the measurement ladder (`make coverage`). Pinned
  # exactly to the vitest version the lockfile resolves: vitest refuses to
  # run the provider against a mismatched major.minor ("mixed versions" is a
  # warning, but a misaligned pair silently reports nothing).
  "@vitest/coverage-v8": "5.0.5"
  # @ofac/protocol runtime deps (Plan 01 Step 4), resolved via npm registry 2026-10.
  ajv: "^8.20.0"
  ajv-formats: "^3.0.1"
  canonicalize: "^5.1.0"
  "@types/node": "^26.6.5"
  # @ofac/workspace-link runtime deps (Plan 04), resolved via npm registry 2026-11.
  "@microsoft/signalr": "^10.0.11"
  better-sqlite3: "^13.0.3"
  # v13 ships NO bundled .d.ts (verified against 13.0.3: no `types` field),
  # so the DefinitelyTyped package is genuinely required — keep them paired.
  "@types/better-sqlite3": "^9.6.0"
  # @ofac/gateway runtime deps (Plan 05), yaml resolved via npm registry 2026-11 (latest 2.9.1).
  yaml: "^2.9.1"
  # @ofac/gateway OIDC claim verification (Plan 12 Step 3).
  jose: "^6.1.0"
  # @ofac/ui (Plan 21): vite 8 + svelte 5 + tailwind 4 + oidc, versions resolved
  # via npm registry 2026-11.
  svelte: "^5.57.3"
  vite: "^8.3.5"
  "@sveltejs/vite-plugin-svelte": "^7.3.1"
  svelte-check: "^4.7.7"
  tailwindcss: "^4.3.3"
  "@tailwindcss/vite": "^4.3.3"
  oidc-client-ts: "^3.5.0"
  # SPA unit tests run against a DOM.
  jsdom: "^30.1.3"
  # Console UX overhaul (console-and-site-ux-overhaul): graph canvas, icon set,
  # layered layout and the YAML editor. Versions verified against the npm
  # registry 2026-11-14 — @xyflow/svelte has no 1.18 line (latest 1.x is 1.7.1,
  # 2.x is still next), so the caret sits on the newest release that exists.
  "@xyflow/svelte": "^1.7.1"
  "lucide-svelte": "^0.545.0"
  dagre: "^0.8.5"
  "@types/dagre": "^0.7.54"
  codemirror: "^6.0.2"
  "@codemirror/lang-yaml": "^6.1.3"
  # pnpm's strict layout does not let the meta-package's transitive modules
  # be imported directly, so the sub-packages the editor wires up are their
  # own catalog lines (versions = what codemirror@6.0.2 pulls, 2026-11-15).
  "@codemirror/autocomplete": "^6.20.4"
  "@codemirror/lint": "^6.9.8"
  "@codemirror/state": "^6.7.6"
  "@codemirror/view": "^6.43.15"
  # harness adapters (omp/codex) ask_user MCP server
  "@modelcontextprotocol/sdk": "^1.32.2"
  # AWS reference deployment (examples/aws): CDK v2 lib + CLI + ECS client,
  # versions resolved via npm registry 2026-11.
  "aws-cdk-lib": "^2.275.0"
  "aws-cdk": "^2.1147.0"
  constructs: "^10.8.1"
  "@aws-sdk/client-ecs": "^3.1161.0"
  "cdk-nag": "^3.0.2"
  # @ofac/otel (OTel three-signal plan), verified on npm 2026-11-13. One
  # version line on purpose: the trace stack has no 3.x release, so pin the
  # 2.x/latest-2 line throughout (exporter 0.223.2 -> sdk-trace 2.12.1 ->
  # core 2.12.1; sdk-logs 0.223.2 -> core 2.12.1).
  # The 2.12.1 line declares peer ">=1.0.0 <1.10.0" against the api, so the
  # latest api 1.10.0 is deliberately out: 1.9.1 is the newest in-range.
  "@opentelemetry/api": "~1.9.1"
  "@opentelemetry/api-logs": "0.223.2"
  "@opentelemetry/core": "2.12.1"
  "@opentelemetry/resources": "2.12.1"
  "@opentelemetry/sdk-trace-node": "2.12.1"
  "@opentelemetry/sdk-trace-base": "2.12.1"
  "@opentelemetry/sdk-trace": "2.12.1"
  "@opentelemetry/context-async-hooks": "2.12.1"
  "@opentelemetry/sdk-metrics": "3.1.1"
  "@opentelemetry/sdk-logs": "0.223.2"
  "@opentelemetry/exporter-trace-otlp-http": "0.223.2"
  "@opentelemetry/exporter-metrics-otlp-http": "0.223.2"
  "@opentelemetry/exporter-logs-otlp-http": "0.223.2"
  "@opentelemetry/otlp-transformer": "0.223.2"
  "@opentelemetry/otlp-exporter-base": "0.223.2"
  "@opentelemetry/semantic-conventions": "^1.45.0"

minimumReleaseAgeExclude:
  - "@opentelemetry/api-logs@0.223.2"
  - "@opentelemetry/exporter-logs-otlp-http@0.223.2"
  - "@opentelemetry/exporter-metrics-otlp-http@0.223.2"
  - "@opentelemetry/exporter-trace-otlp-http@0.223.2"
  - "@opentelemetry/otlp-exporter-base@0.223.2"
  - "@opentelemetry/otlp-transformer@0.223.2"
  - "@opentelemetry/sdk-logs@0.223.2"
