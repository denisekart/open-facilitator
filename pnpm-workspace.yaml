  tsup: "^9.0.0"
  vitest: "^5.0.5"
  # @ofac/protocol runtime deps (Plan 01 Step 4), resolved via npm registry 2026-10.
  ajv: "^8.20.0"
  ajv-formats: "^3.0.1"
  canonicalize: "^2.1.0"
  "@types/node": "^22.9.0"
