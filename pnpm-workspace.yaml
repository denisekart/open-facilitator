packages:
  - "src/gateway"
  - "src/adapters/harnesses/adapter-sdk"
  - "src/adapters/harnesses/deterministic"
  - "src/adapters/harnesses/omp"
  - "src/adapters/harnesses/codex"
  - "src/protocol"
  - "src/workspace-link"
  - "src/facilitator/ui"
  - "src/adapters/provider-core"
  - "src/adapters/communication/mattermost"
  - "src/adapters/communication/forgejo"
  - "src/adapters/communication/forgejo-connector"
  - "src/adapters/communication/github"
  - "src/adapters/communication/github-connector"
  - "src/adapters/communication/gitlab"
  - "src/adapters/communication/gitlab-connector"
  - "src/adapters/provisioning-oci"
  - "examples/aws"
  - "examples/aws/fleet-launcher"
  - "examples/full/coding-worker"
  - "examples/local/tools/localctl"
  - "protocol/tools/link-client-foreign"

allowBuilds:
  better-sqlite3: false
  esbuild: true
  # better-sqlite3 13 is deliberately NOT allow-built: its published install
  # script (`node-gyp rebuild`) needs node-gyp + a SQLite source download,
  # while the tarball ships prebuilds/ for linux+darwin+win x64/arm64 that
  # lib/binding.js loads directly. Skipping the script uses the prebuild.

catalog:
  # versions resolved by `pnpm add -Dw` (Plan 00 Step 3). TS 6.x: tsup 9 and
  # typescript-eslint 8 do not support the TypeScript 7 native compiler yet.
  typescript: "^6.0.3"
  tsup: "^9.0.0"
  vitest: "^5.0.5"
  # @ofac/protocol runtime deps (Plan 01 Step 4), resolved via npm registry 2026-10.
  ajv: "^8.20.0"
  ajv-formats: "^3.0.1"
  canonicalize: "^5.1.0"
  "@types/node": "^26.6.5"
  # @ofac/workspace-link runtime deps (Plan 04), resolved via npm registry 2026-11.
  "@microsoft/signalr": "^10.0.11"
  better-sqlite3: "^13.0.3"
  # v13 ships NO bundled .d.ts (verified against 13.0.3: no `types` field),
  # so the DefinitelyTyped package is genuinely required — keep them paired.
  "@types/better-sqlite3": "^9.6.0"
  # @ofac/gateway runtime deps (Plan 05), yaml resolved via npm registry 2026-11 (latest 2.9.1).
  yaml: "^2.9.1"
  # @ofac/gateway OIDC claim verification (Plan 12 Step 3).
  jose: "^6.1.0"
  # @ofac/ui (Plan 21): vite 8 + svelte 5 + tailwind 4 + oidc, versions resolved
  # via npm registry 2026-11.
  svelte: "^5.57.3"
  vite: "^8.3.5"
  "@sveltejs/vite-plugin-svelte": "^7.3.1"
  svelte-check: "^4.7.7"
  tailwindcss: "^4.3.3"
  "@tailwindcss/vite": "^4.3.3"
  oidc-client-ts: "^3.5.0"
  # SPA unit tests run against a DOM.
  jsdom: "^30.1.3"
  # harness adapters (omp/codex) ask_user MCP server
  "@modelcontextprotocol/sdk": "^1.32.2"
  # AWS reference deployment (examples/aws): CDK v2 lib + CLI + ECS client,
  # versions resolved via npm registry 2026-11.
  "aws-cdk-lib": "^2.275.0"
  "aws-cdk": "^2.1147.0"
  constructs: "^10.8.1"
  "@aws-sdk/client-ecs": "^3.1161.0"
  "cdk-nag": "^3.0.2"
