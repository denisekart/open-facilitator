openapi: 3.1.0
info:
  title: Facilitator Admin API
  version: 1.0.0
  description: >
    Hand-maintained mirror of the kernel /api/admin surface (spec section 17)
    — the operator read models plus the three mutations the embedded
    inspector may issue. These DTOs are kernel-API contract, not wire protocol:
    unlike link-v1.yaml there are no JSON-Schema $refs and no conformance
    fixtures; runtime tests (tests/Facilitator.Tests/Admin/AdminSurfaceTests.cs,
    AdminConfigStoreTests.cs) are the drift check and this file the readable
    contract. Authorization is 100% config-driven
    (identity:authorization:operations bindings admin.read / admin.mutate);
    every route below carries one of the two, so 401 and 403 apply everywhere.
    Every error is RFC 9457 ProblemDetails with a
    https://errors.openfacilitator.org/v1/{code} type.
servers:
  - url: /
tags:
  - name: read
    description: Roll-ups and detail views (binding admin.read).
  - name: mutate
    description: Operator mutations (binding admin.mutate).
paths:
  /api/admin/summary:
    get:
      operationId: getSummary
      tags: [read]
      summary: One-roll-up health view of every plane.
      responses:
        "200":
          description: The roll-up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/search:
    get:
      operationId: search
      tags: [read]
      summary: Universal search across works, projects, assignments, artifacts, memories, messages.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
          description: Free-text query; absent/blank is 400 search-query-required.
        - name: type
          in: query
          schema: { type: string, enum: [works, projects, assignments, artifacts, memories, messages] }
          description: Restrict to one section.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
          description: Per-section cap (clamped).
      responses:
        "200":
          description: Sections of hits, each independently bounded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSearchResults" }
        "400":
          description: Missing/blank q — search-query-required.
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/projects/{id}:
    get:
      operationId: getProject
      tags: [read]
      summary: Project detail with its work list.
      parameters: [ { $ref: "#/components/parameters/ProjectId" } ]
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProjectDetail" }
        "404":
          description: project-not-found (no disclosure of off-team existence).
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/work/{id}:
    get:
      operationId: getWork
      tags: [read]
      summary: Work aggregate detail — assignments with attempts, approvals, manifests.
      parameters: [ { $ref: "#/components/parameters/WorkId" } ]
      responses:
        "200":
          description: The work detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminWorkDetail" }
        "404":
          description: work-not-found.
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/work/{id}/timeline:
    get:
      operationId: getWorkTimeline
      tags: [read]
      summary: The work timeline (identical WorkEventRow shape as GET /api/works/{id}/timeline).
      parameters: [ { $ref: "#/components/parameters/WorkId" } ]
      responses:
        "200":
          description: Timeline rows, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkEventRow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/links:
    get:
      operationId: getLinks
      tags: [read]
      summary: Gateway link state (lease = online authority) + assignments affected by offline gateways.
      responses:
        "200":
          description: The links view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLinksView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/deliveries:
    get:
      operationId: getDeliveries
      tags: [read]
      summary: >
        Merged plane view — kernel-plane outbox rows, link-plane delivery rows,
        and dead-letter rows (superset that replaced /api/dev/deliveries and
        GET /api/dead-letters).
      parameters:
        - name: state
          in: query
          schema: { type: string, enum: [pending, leased, delivered, dead_letter] }
          description: Filter by state; anything else is ignored (all rows).
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
          description: Total cap (clamped).
      responses:
        "200":
          description: Newest-first merged rows.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminDeliveryRow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/provisioning:
    get:
      operationId: getProvisioning
      tags: [read]
      summary: Newest provisioning ops (the scale-law ledger).
      responses:
        "200":
          description: Newest-first ops.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminProvisioningRow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/replicas:
    get:
      operationId: getReplicas
      tags: [read]
      summary: Per-replica fleet view — which replica stamps each live lease, sockets held here, fleet queue depth.
      responses:
        "200":
          description: The replicas view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReplicasView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/metrics:
    get:
      operationId: getMetrics
      tags: [read]
      summary: Gauges + windowed per-hour table facts + process counter snapshot.
      parameters:
        - name: window
          in: query
          schema: { type: string, enum: ["1h", "24h"], default: "1h" }
          description: Bucket window for the per-hour series (unrecognized = 1h).
      responses:
        "200":
          description: The roll-up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMetrics" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/works:
    get:
      operationId: getWorksQueue
      tags: [read]
      summary: The operator work queue — the GET /api/works law under the admin binding.
      description: >
        Same scoping law as the human-plane list: the caller's team scope
        applies automatically, `team` narrows within it (a foreign team
        answers empty, never another team's works). `state` accepts a
        comma-separated list of wire states; unparseable words are ignored.
      parameters:
        - { in: query, name: state, schema: { type: string }, description: "Comma list of open|planning|active|review|completed|blocked|cancelled|failed." }
        - { in: query, name: team, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Newest-first queue rows.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminWorkRow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/audit:
    get:
      operationId: getAudit
      tags: [read]
      summary: Audit trail, newest first, filterable by action, actor, decision, correlation id, and a since floor.
      parameters:
        - { in: query, name: action, schema: { type: string } }
        - { in: query, name: actor, schema: { type: string } }
        - { in: query, name: decision, schema: { type: string, enum: [allow, deny] } }
        - { in: query, name: correlation, schema: { type: string }, description: "Exact correlation_id join (chat action ids, sweep names, work event correlation)." }
        - { in: query, name: since, schema: { type: string, format: date-time } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Newest-first audit rows.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminAuditRow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/audit/export:
    get:
      operationId: getAuditExport
      summary: Audit-trail export (H3/N15)
      description: >
        A closed window of the audit trail, credential-free by construction
        (no trace ids, no secrets). JSON (default) or CSV (`format=csv`);
        `team` narrows to rows whose resource names that team's work.
        Retention: `admin_config/audit-policy` (`retentionDays`) prunes
        aged rows via `POST /api/admin/sweeps/audit-retention`.
      parameters:
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
        - { in: query, name: team, schema: { type: string } }
        - { in: query, name: format, schema: { type: string, enum: [json, csv] } }
      responses:
        "200": { description: The export (application/json or text/csv). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/sweeps/{name}:
    post:
      operationId: runSweep
      summary: Force one sweeper pass (I2)
      description: >
        `nudge` | `approvals` | `schedules` | `session-loss` |
        `audit-retention`: runs the sweep now instead of waiting for the
        hosted loop. Answers the effect count (a pass a peer replica holds
        answers 0). A manual sweep is a human act on live state: the
        `X-Change-Reason` header is REQUIRED (non-empty, <= 512 chars) and
        the trigger is audited (`admin.sweep`, correlation_id = the sweep
        name).
      parameters:
        - { in: path, name: name, required: true, schema: { type: string } }
        - in: header
          name: X-Change-Reason
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
          description: Why the operator forced the sweep; audited. Blank/oversize is 400 config-invalid.
      responses:
        "200": { description: "{ sweep, effects }" }
        "400": { description: "Unknown sweep name, or a missing/oversize X-Change-Reason (config-invalid)." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/config:
    get:
      operationId: listConfig
      tags: [read]
      summary: Registry of writable resources with stored-ness and version (never 404s).
      responses:
        "200":
          description: One row per registry resource.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [resource, exists, rowVersion]
                  properties:
                    resource: { $ref: "#/components/schemas/ConfigResource" }
                    exists: { type: boolean }
                    rowVersion: { type: integer, format: int64, description: 0 when never written. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/config/{resource}:
    parameters: [ { $ref: "#/components/parameters/ConfigResource" } ]
    get:
      operationId: getConfig
      tags: [read]
      summary: Stored payload with its ETag (rowVersion).
      responses:
        "200":
          description: The stored view.
          headers:
            ETag:
              schema: { type: string }
              description: Quoted rowVersion; feed it back as If-Match.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminConfigView" }
        "404":
          description: >
            config-not-set (registry resource, never written) or
            config-resource-unknown (not in the registry).
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      operationId: patchConfig
      tags: [mutate]
      summary: >
        Replace the payload. The law: every write states the revision it saw —
        If-Match is REQUIRED ('*' forces; a quoted integer ETag fences) and
        X-Change-Reason is REQUIRED; both land in the audit + history trail.
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
          description: "'*' (force/create) or the quoted ETag from GET; absent/malformed is 428."
        - name: X-Change-Reason
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
          description: Why the operator changed it; audited and kept in history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: The full new payload for the resource (shape per registry validator).
      responses:
        "200":
          description: Stored; response carries the new ETag.
          headers:
            ETag:
              schema: { type: string }
              description: Quoted new rowVersion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminConfigView" }
        "400":
          description: config-invalid (header/body/shape) or config-payload-too-large.
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "404":
          description: config-resource-unknown.
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "412":
          description: config-version-conflict — If-Match did not fence; extensions.currentVersion is the stored one.
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "428":
          description: config-precondition-missing — no/malformed If-Match.
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/config/{resource}/history:
    get:
      operationId: getConfigHistory
      tags: [read]
      summary: Bounded change trail (newest first; the table keeps only the newest 20 rows).
      parameters:
        - { $ref: "#/components/parameters/ConfigResource" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        "200":
          description: History entries, newest first (empty for a never-written resource).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminConfigHistoryEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/dead-letters/{deadLetterId}/replay:
    post:
      operationId: replayDeadLetter
      tags: [mutate]
      summary: >
        Re-enqueue the dead-lettered outbox row from its byte-identical
        snapshot (a replay never edits the payload); the ledger allows exactly
        one replay command per dead letter.
      parameters:
        - name: deadLetterId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Replayed; the outbox row is pending again.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [deadLetterId, replayed]
                properties:
                  deadLetterId: { type: string, format: uuid }
                  replayed: { type: boolean, enum: [true] }
        "404":
          description: dead-letter-not-found.
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "409":
          description: version-conflict — already replayed.
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "422":
          description: replay-envelope-invalid — snapshot fails contract validation.
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/manifests/{manifestId}/re-mark:
    post:
      operationId: reMarkManifest
      tags: [mutate]
      summary: >
        Human re-mark of a recorded manifest's resultState
        (available|validated|rejected only — missing/superseded are chain-law owned).
      parameters:
        - name: manifestId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [resultState]
              properties:
                resultState: { type: string, enum: [available, validated, rejected] }
      responses:
        "200":
          description: Re-marked.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [manifestId, resultState]
                properties:
                  manifestId: { type: string }
                  resultState: { type: string, enum: [available, validated, rejected] }
        "400":
          description: manifest-re-mark-invalid.
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "404":
          description: manifest-not-found.
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/workflows/definitions:
    get:
      operationId: listWorkflowDefinitions
      tags: [read]
      summary: Workflow definitions (latest version each) with enablement and running-instance counts.
      responses:
        "200":
          description: Definition summaries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkflowDefinitionSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/workflows/definitions/{id}:
    get:
      operationId: getWorkflowDefinition
      tags: [read]
      summary: One definition version; an Accept of application/yaml answers with the YAML view.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: version, schema: { type: integer, minimum: 1 }, description: Omitted = latest version. }
        - { in: header, name: Accept, schema: { type: string }, description: "application/yaml returns the serialization view." }
      responses:
        "200":
          description: The definition (summary + canonical document + yaml) or the YAML view.
          content:
            application/json:
              schema:
                type: object
                description: summary/document/yaml/createdAt/createdBy
                additionalProperties: true
            application/yaml:
              schema: { type: string }
        "404":
          description: definition-not-found.
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putWorkflowDefinition
      tags: [mutate]
      summary: >
        Store a NEW version of a definition (versions are immutable once
        stored). Same law as the config surface: If-Match REQUIRED ('*'
        forces; a quoted sha256 ETag fences against the latest digest),
        X-Change-Reason REQUIRED; validation findings come back 422 with an
        errors extension.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
        - name: X-Change-Reason
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true, description: Canonical workflow-definition.v1 document. }
          application/yaml:
            schema: { type: string, description: The YAML view face. }
      responses:
        "200":
          description: Stored; the new version's summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowDefinitionSummary" }
        "400":
          description: config-invalid (header/body) or too large.
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "412":
          description: version-conflict — If-Match did not fence.
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "422":
          description: definition-invalid (schema or referential law); extensions.errors lists structured findings.
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/workflows/definitions/validate:
    post:
      operationId: validateWorkflowDefinition
      tags: [mutate]
      summary: Dry-run validation; answers structured findings, never stores.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: "{ ok, errors[] } — ok false with findings is a success response."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, errors]
                properties:
                  ok: { type: boolean }
                  errors:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [code, detail]
                      properties:
                        code: { type: string }
                        detail: { type: string }
        "400":
          description: missing X-Change-Reason.
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/workflows/definitions/export:
    get:
      operationId: exportWorkflowDefinitions
      tags: [read]
      summary: Directory listing of every stored version as YAML files.
      responses:
        "200":
          description: "{ directory, files: [{ name, yaml }] }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/workflows/definitions/import:
    post:
      operationId: importWorkflowDefinitions
      tags: [mutate]
      summary: Import YAML/JSON files; an id/version collision skips (import never overwrites).
      parameters:
        - name: X-Change-Reason
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [name, content]
                    properties:
                      name: { type: string }
                      content: { type: string }
                      ifMatch: { type: string }
      responses:
        "200":
          description: Per-file outcomes.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          description: missing X-Change-Reason or body shape.
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/workflows/definitions/{id}/versions/{version}/toggle:
    post:
      operationId: toggleWorkflowDefinition
      tags: [mutate]
      summary: >
        Enable/disable or flip shadow on one exact version (the only in-place
        update the store allows; enabling a not-yet-executable palette fails
        422 step-kind-not-supported).
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: version, required: true, schema: { type: integer, minimum: 1 } }
        - name: X-Change-Reason
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enabled: { type: boolean }
                shadow: { type: boolean }
      responses:
        "200":
          description: Toggled; the version's summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowDefinitionSummary" }
        "404":
          description: definition-not-found.
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "422":
          description: enabling refused (step-kind-not-supported, invoke-target-unavailable, composition-cycle).
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/workflows/instances:
    get:
      operationId: listWorkflowInstances
      tags: [read]
      summary: >
        The flows console's checklist feed: newest instances first, one
        definition optionally, bounded by limit.
      parameters:
        - { in: query, name: def, required: false, schema: { type: string } }
        - { in: query, name: work, required: false, schema: { type: string, format: uuid }, description: Only the instance backing this work (the console's work strip). }
        - { in: query, name: limit, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        "200":
          description: Instance rows (newest first).
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/workflows/instances/{instanceId}/log:
    get:
      operationId: getWorkflowInstanceLog
      tags: [read]
      summary: >
        The vertical checklist: an instance's step-log rows, oldest first.
      parameters:
        - { in: path, name: instanceId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Step-log rows.
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/workflows/instances/{instanceId}:
    get:
      operationId: getWorkflowInstance
      tags: [read]
      summary: >
        Composition observability: one instance with its ancestor chain and
        direct children (the lineage ends of every invoke edge recorded).
      parameters:
        - { in: path, name: instanceId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The instance, its ancestors, and its direct children.
          content:
            application/json:
              schema: { type: object }
        "404":
          description: instance-not-found.
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/workflows/instances/{instanceId}/pause:
    post:
      operationId: pauseWorkflowInstance
      tags: [write]
      summary: >
        Pause a running or parked instance: no leg starts, a park keeps its deadline, wakes fall through to on.event until resumed.
      parameters:
        - { in: path, name: instanceId, required: true, schema: { type: string, format: uuid } }
        - name: X-Change-Reason
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema: { type: object }
        "404":
          description: instance-not-found.
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "409":
          description: not-applicable (the fenced status guard refused).
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/workflows/instances/{instanceId}/resume:
    post:
      operationId: resumeWorkflowInstance
      tags: [write]
      summary: >
        Resume a paused instance: a park returns to waiting (deadline intact), a runner returns to running and walks.
      parameters:
        - { in: path, name: instanceId, required: true, schema: { type: string, format: uuid } }
        - name: X-Change-Reason
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema: { type: object }
        "404":
          description: instance-not-found.
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "409":
          description: not-applicable (the fenced status guard refused).
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/workflows/instances/{instanceId}/skip-step:
    post:
      operationId: skipWorkflowInstanceStep
      tags: [write]
      summary: >
        The CURRENT leg ends 'skipped' and the run takes its completed edge; the operator does not fork the edge law.
      parameters:
        - { in: path, name: instanceId, required: true, schema: { type: string, format: uuid } }
        - name: X-Change-Reason
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema: { type: object }
        "404":
          description: instance-not-found.
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "409":
          description: not-applicable (the fenced status guard refused).
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/workflows/instances/{instanceId}/retry-step:
    post:
      operationId: retryWorkflowInstanceStep
      tags: [write]
      summary: >
        A FAILED run re-enters the named leg (fresh leg seq, fresh step-command id) and advances immediately.
      parameters:
        - { in: path, name: instanceId, required: true, schema: { type: string, format: uuid } }
        - name: X-Change-Reason
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stepId]
              properties:
                stepId: { type: string }
      responses:
        "400":
          description: body must carry stepId.
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "200":
          description: Applied.
          content:
            application/json:
              schema: { type: object }
        "404":
          description: instance-not-found.
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "409":
          description: not-applicable (the fenced status guard refused).
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/workflows/instances/{instanceId}/cancel:
    post:
      operationId: cancelWorkflowInstance
      tags: [write]
      summary: >
        Operator cancel: the instance and its whole non-terminal subtree end
        cancelled (end_reason operator-cancel); in-flight wakes resolve as
        no-ops under the park race law.
      parameters:
        - { in: path, name: instanceId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Cancelled (the instance and its subtree).
          content:
            application/json:
              schema: { type: object }
        "409":
          description: not-cancellable (absent or already terminal).
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/workflows/shadow/report:
    get:
      operationId: getWorkflowShadowReport
      tags: [read]
      summary: >
        Shadow reconciliation: the plane's would-do step-log records diffed
        against the acting arm's recorded effects (judgment, link, binding,
        reply), keyed on the trigger delivery identity — the gate before a
        shadow definition is swapped to own the behavior.
      parameters:
        - in: query
          name: since
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: One row per reconciled delivery (empty array = nothing to reconcile yet).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [provider, deliveryId, judgment, planeWouldAct, armActed, match, diffs]
                  properties:
                    provider: { type: string }
                    deliveryId: { type: string }
                    judgment: { type: string }
                    instanceId: { type: ["string", "null"], format: uuid }
                    planeWouldAct: { type: boolean }
                    armActed: { type: boolean }
                    match: { type: boolean }
                    diffs:
                      type: array
                      items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/workflows/registry:
    get:
      operationId: getWorkflowRegistry
      tags: [read]
      summary: Closed sets the editor may SELECT from (event types, commands, advertised capabilities, callable definitions, teams).
      responses:
        "200":
          description: The registry document.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        OIDC principal; each route needs the admin.read (GET) or admin.mutate
        (PATCH/POST) operation binding from identity:authorization:operations.
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConfigResource:
      name: resource
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ConfigResource" }
  responses:
    Unauthorized:
      description: No valid bearer principal.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Forbidden:
      description: Principal lacks the route's operation binding.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
  schemas:
    Problem:
      description: RFC 9457 ProblemDetails; type is https://errors.openfacilitator.org/v1/{code}.
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    ConfigResource:
      type: string
      enum: [notifications, retry-policy, nudge-policy, workload-scale, routing-defaults]
    AdminSummary:
      type: object
      additionalProperties: false
      required: [teams, projects, workByState, assignmentsByState, executionsByState, gatewaysOnline, gatewaysOffline, inboxByState, outboxByState, deadLettersTotal, approvalsByState, artifactsTotal, manifestsByResultState, memoryByStatus, linkSessionsLive]
      properties:
        teams: { type: integer }
        projects: { type: integer }
        workByState: { type: object, additionalProperties: { type: integer } }
        assignmentsByState: { type: object, additionalProperties: { type: integer } }
        executionsByState: { type: object, additionalProperties: { type: integer } }
        gatewaysOnline: { type: integer }
        gatewaysOffline: { type: integer }
        inboxByState: { type: object, additionalProperties: { type: integer } }
        outboxByState: { type: object, additionalProperties: { type: integer } }
        deadLettersTotal: { type: integer }
        oldestPendingOutboxAt: { type: [string, "null"], format: date-time }
        approvalsByState: { type: object, additionalProperties: { type: integer } }
        artifactsTotal: { type: integer }
        manifestsByResultState: { type: object, additionalProperties: { type: integer } }
        memoryByStatus: { type: object, additionalProperties: { type: integer } }
        linkSessionsLive: { type: integer }
    AdminSearchHit:
      type: object
      additionalProperties: false
      required: [id, display, state, at]
      properties:
        id: { type: string }
        display: { type: string }
        state: { type: string }
        at: { type: string, format: date-time }
    AdminSearchResults:
      type: object
      additionalProperties: false
      required: [query, works, projects, assignments, artifacts, memories, messages]
      properties:
        query: { type: string }
        works: { type: array, items: { $ref: "#/components/schemas/AdminSearchHit" } }
        projects: { type: array, items: { $ref: "#/components/schemas/AdminSearchHit" } }
        assignments: { type: array, items: { $ref: "#/components/schemas/AdminSearchHit" } }
        artifacts: { type: array, items: { $ref: "#/components/schemas/AdminSearchHit" } }
        memories: { type: array, items: { $ref: "#/components/schemas/AdminSearchHit" } }
        messages: { type: array, items: { $ref: "#/components/schemas/AdminSearchHit" } }
    AdminLinkRow:
      type: object
      additionalProperties: false
      required: [endpointId, team, trustMode, online]
      properties:
        endpointId: { type: string }
        team: { type: string }
        trustMode: { type: string }
        capabilitiesDigest: { type: [string, "null"] }
        online: { type: boolean, description: Lease-derived; stale gateways collapse to offline. }
        sessionEpoch: { type: [integer, "null"], format: int64 }
        leaseUntil: { type: [string, "null"], format: date-time }
        lastHeartbeat: { type: [string, "null"], format: date-time }
        replicaId: { type: [string, "null"], description: Best-effort per-replica socket attribution. }
        liveSockets: { type: integer }
    AdminAffectedAssignment:
      type: object
      additionalProperties: false
      required: [assignmentId, workId, status]
      properties:
        assignmentId: { type: string, format: uuid }
        workId: { type: string, format: uuid }
        status: { type: string }
    AdminLinksView:
      type: object
      additionalProperties: false
      required: [gateways, affectedAssignments]
      properties:
        gateways: { type: array, items: { $ref: "#/components/schemas/AdminLinkRow" } }
        affectedAssignments: { type: array, items: { $ref: "#/components/schemas/AdminAffectedAssignment" } }
    AdminDeliveryRow:
      type: object
      additionalProperties: false
      required: [plane, id, state, attempts, updatedAt]
      properties:
        plane: { type: string, enum: [outbox, link, dead_letter] }
        id: { type: string, format: uuid }
        state: { type: string }
        attempts: { type: integer }
        lastError: { type: [string, "null"] }
        availableAt: { type: [string, "null"], format: date-time }
        endpointId: { type: [string, "null"] }
        sessionEpoch: { type: [integer, "null"], format: int64 }
        redeliverAfter: { type: [string, "null"], format: date-time }
        reason: { type: [string, "null"], description: Dead-letter row cause. }
        updatedAt: { type: string, format: date-time }
    AdminHourBucket:
      type: object
      additionalProperties: false
      required: [hour, count]
      properties:
        hour: { type: string, format: date-time }
        count: { type: integer, format: int64 }
    AdminProvisioningRow:
      type: object
      additionalProperties: false
      required: [operationId, workloadId, team, operation, state, createdAt, updatedAt]
      properties:
        operationId: { type: string, description: Deterministic hash id (replay-safe). }
        workloadId: { type: string }
        team: { type: string }
        operation: { type: string, enum: [start, stop] }
        state: { type: string, enum: [requested, running, stopped, failed] }
        workId: { type: [string, "null"], format: uuid }
        assignmentId: { type: [string, "null"], format: uuid }
        generation: { type: [integer, "null"] }
        reason: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminReplicaRow:
      type: object
      additionalProperties: false
      required: [replicaId, liveSessions, socketsHere]
      properties:
        replicaId: { type: string, description: Lease identity stamped on link_sessions rows. }
        liveSessions: { type: integer, description: Live leases this replica stamps (fleet-wide view). }
        socketsHere: { type: integer, description: Of those, endpoints THIS replica holds a socket for. }
    AdminReplicasView:
      type: object
      additionalProperties: false
      required: [answeringReplicaId, replicas, outboxPending]
      properties:
        answeringReplicaId: { type: string, description: Identity of the replica that answered. }
        replicas:
          type: array
          items: { $ref: "#/components/schemas/AdminReplicaRow" }
        outboxPending: { type: integer, format: int64, description: Fleet queue depth (shared tables, identical from every replica). }
    AdminMetrics:
      type: object
      additionalProperties: false
      required: [outboxPending, inboxPending, deadLetters, linkSessions, queueOldestWaitSeconds, deadLettersPerHour, auditDeniesPerHour, artifactsStoredPerHour, artifactsRejectedPerHour, counters]
      properties:
        outboxPending: { type: integer, format: int64 }
        inboxPending: { type: integer, format: int64 }
        deadLetters: { type: integer, format: int64 }
        linkSessions: { type: integer, format: int64 }
        queueOldestWaitSeconds: { type: number, format: double, description: "Age of the oldest pending routing intent - the starvation gauge (seconds, 0 when the queue is empty)." }
        deadLettersPerHour: { type: array, items: { $ref: "#/components/schemas/AdminHourBucket" } }
        auditDeniesPerHour: { type: array, items: { $ref: "#/components/schemas/AdminHourBucket" } }
        artifactsStoredPerHour: { type: array, items: { $ref: "#/components/schemas/AdminHourBucket" } }
        artifactsRejectedPerHour: { type: array, items: { $ref: "#/components/schemas/AdminHourBucket" } }
        counters: { type: object, additionalProperties: { type: integer, format: int64 } }
    AdminProjectDetail:
      type: object
      additionalProperties: false
      required: [projectId, name, config, createdAt, works]
      properties:
        projectId: { type: string, format: uuid }
        name: { type: string }
        teamSlug: { type: [string, "null"] }
        config: { type: object }
        createdAt: { type: string, format: date-time }
        works: { type: array, items: { $ref: "#/components/schemas/AdminWorkRow" } }
    AdminAuditRow:
      type: object
      additionalProperties: false
      required: [auditId, occurredAt, action, decision, detail]
      properties:
        auditId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        actor: { type: [string, "null"] }
        action: { type: string }
        resource: { type: [string, "null"] }
        decision: { type: string, enum: [allow, deny] }
        reason: { type: [string, "null"] }
        detail: { type: object }
        traceId: { type: [string, "null"] }
        correlationId: { type: [string, "null"], description: Exact join key (chat action ids, sweep names, work event correlation). }
    AdminWorkRow:
      type: object
      additionalProperties: false
      required: [workId, objective, state, version, createdAt, updatedAt]
      properties:
        workId: { type: string, format: uuid }
        objective: { type: string }
        state: { type: string }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        teamSlug: { type: [string, "null"] }
        ownerActor: { type: [string, "null"] }
        origin: { type: [string, "null"] }
        mergedInto: { type: [string, "null"], format: uuid }
        closeReason: { type: [string, "null"] }
    AdminWorkDetail:
      type: object
      additionalProperties: false
      required: [work, assignments, approvals, manifests]
      properties:
        work: { $ref: "#/components/schemas/AdminWorkRow" }
        projectId: { type: [string, "null"] }
        assignments: { type: array, items: { $ref: "#/components/schemas/AdminAssignmentRow" } }
        approvals: { type: array, items: { $ref: "#/components/schemas/AdminApprovalRow" } }
        manifests: { type: array, items: { $ref: "#/components/schemas/AdminManifestRow" } }
    AdminAssignmentRow:
      type: object
      additionalProperties: false
      required: [assignmentId, status, currentExecutionGeneration, createdAt, updatedAt, attempts]
      properties:
        assignmentId: { type: string, format: uuid }
        status: { type: string }
        currentExecutionGeneration: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        attempts: { type: array, items: { $ref: "#/components/schemas/AdminAttemptRow" } }
    AdminAttemptRow:
      type: object
      additionalProperties: false
      required: [executionId, generation, status, startedAt]
      properties:
        executionId: { type: string, format: uuid }
        generation: { type: integer }
        status: { type: string }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, "null"], format: date-time }
    AdminApprovalRow:
      type: object
      additionalProperties: false
      required: [approvalId, state, actionDigest, createdAt]
      properties:
        approvalId: { type: string, format: uuid }
        state: { type: string }
        actionDigest: { type: string }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: [string, "null"], format: date-time }
    AdminManifestRow:
      type: object
      additionalProperties: false
      required: [manifestId, revision, resultState, state, artifactId, outputArtifactIds, recordedAt]
      properties:
        manifestId: { type: string }
        revision: { type: integer }
        revisionOf: { type: [string, "null"] }
        resultState: { type: string }
        state: { type: string }
        artifactId: { type: string, format: uuid }
        outputArtifactIds: { type: array, items: { type: string } }
        recordedAt: { type: string, format: date-time }
    WorkEventRow:
      description: Timeline row — identical to GET /api/works/{id}/timeline entries.
      type: object
      additionalProperties: true
    AdminConfigView:
      type: object
      additionalProperties: false
      required: [resource, payload, rowVersion, author, reason, updatedAt]
      properties:
        resource: { $ref: "#/components/schemas/ConfigResource" }
        payload: { type: object }
        rowVersion: { type: integer, format: int64, description: The ETag source. }
        author: { type: string, description: Canonical actor of the last write. }
        reason: { type: string, description: X-Change-Reason of the last write. }
        updatedAt: { type: string, format: date-time }
    AdminConfigHistoryEntry:
      type: object
      additionalProperties: false
      required: [version, payload, author, reason, updatedAt]
      properties:
        version: { type: integer, format: int64 }
        payload: { type: object }
        author: { type: string }
        reason: { type: string }
        updatedAt: { type: string, format: date-time }
    WorkflowDefinitionSummary:
      type: object
      additionalProperties: false
      required: [id, version, title, description, source, enabled, shadow, digest, instancesRunning]
      properties:
        id: { type: string, description: Definition id (idToken). }
        version: { type: integer, minimum: 1, description: Latest version. }
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        source: { type: string, enum: [gallery, hand, ai, derived] }
        enabled: { type: boolean }
        shadow: { type: boolean, description: "Strangler flag: arm acts, plane computes." }
        team: { type: ["string", "null"], description: "Team scope slug." }
        digest: { type: string, description: "sha256 of the canonical payload (the ETag)." }
        instancesRunning: { type: integer, description: "Instances in running|waiting on any version." }
security:
  - bearerAuth: []
