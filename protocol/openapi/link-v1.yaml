openapi: 3.1.0
info:
  title: Open Facilitator — Workspace Link HTTP surface (v1)
  version: 2.0.0
  description: |
    Provider-neutral HTTP fallback for the Workspace Link contract.
    SignalR is the default reference transport; these endpoints carry identical
    application semantics and MUST pass the same conformance suite
    (protocol/conformance-fixtures/).

    Wire limits: the full serialized CloudEvents envelope MUST NOT exceed
    262144 bytes (256 KiB; the fixture index `limits.maxEnvelopeBytes` is the
    single source of truth). Artifacts never travel inline — they move through
    scoped artifact storage and are referenced by digest
    (components ArtifactRefV1).

    Authentication: on the link plane the bearer is a short-lived (5-minute)
    kernel-signed session JWT, obtained by proving possession of the
    endpoint's enrolled Ed25519 key against a kernel nonce
    (`POST /challenge` then `POST /proof`); there is no long-lived link
    bearer. The authenticated principal — not a JSON field — determines
    allowed team/Gateway/workspace identity. `POST /api/link/v1/enroll`
    itself is guarded by the one-time enrollment code, and
    `POST /api/link/v1/challenge` by nothing at all: a challenge proves
    nothing, so it cannot be guarded by what it is issuing.

    Served by the kernel Link server; the admin surface mirror lives in
    admin-v1.yaml.

    1.0.1 rationale (additive minor change): EnrollResponse gains the optional
    `linkToken` and `expiresAt` properties — the interim per-endpoint bearer
    credential the Link server issues at enrollment — and
    `POST /api/link/v1/capabilities` is added so an endpoint can advertise its
    CapabilityManifest over the HTTP surface. No existing field changed
    meaning or requiredness, so per semver/OpenAPI additive-change
    conventions the minor bump is the only compatibility action required.
    EnrollRequest / EnrollResponse / Delivery are now $refs to their
    single-source-of-truth JSON Schema files (the precedent set by the events
    path above); Delivery sits beside the envelope schema it embeds, under
    protocol/cloudevents-schemas/.

    1.0.2 rationale (additive minor change): EnrollRequest gains the optional
    `role` (enum gateway|child) and `team` (idToken) properties — the workload
    role and team roster slug a kernel binds at enrollment — and the
    shared `evidenceRef` bound loosens from 256 to 2048 characters so an
    inline `oidc:<jwt>` delegation evidence reference fits (every value valid
    under 1.0.1 stays valid). No existing field changed meaning or
    requiredness, so per the 1.0.1 precedent the minor bump is the only
    compatibility signalled.

    2.0.0 rationale (breaking — the credential becomes an identity): the
    720-hour shared bearer is deleted. EnrollRequest now REQUIRES
    `publicKey` (raw Ed25519, base64url) and `keyAlgorithm` (enum ed25519);
    EnrollResponse drops `linkToken`/`expiresAt` and instead REQUIRES
    `endpointKeyId` (the `sha256:<hex64>` fingerprint of the registered key)
    and `seq` (the replay fence the endpoint starts from). Authentication for
    every other path on this plane moves to the 5-minute session JWT described
    above, minted by the new `POST /api/link/v1/challenge` and
    `POST /api/link/v1/proof` pair; `POST /api/link/v1/enroll/{endpointId}/rotate`
    lets an endpoint swap its own key under proof by both the old and the new
    key. A 1.0.x client that posts no public key is now rejected with a
    schema-violation problem rather than silently enrolled — one wire, no
    legacy credential class.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/link/v1/enroll:
    post:
      operationId: enroll
      summary: Bootstrap enrollment for a Gateway/Workspace Link endpoint
      description: |
        Registers the endpoint's Ed25519 public key as its identity. The
        request's `token` is the one-time enrollment code (or the configured
        bootstrap secret) — it authorizes the join and retires. The response
        carries no secret: an `endpointKeyId` fingerprint and the `seq` fence
        to start from.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollRequest"
      responses:
        "201":
          description: Enrollment accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollResponse"
        "400":
          description: Body violates enroll-request.v1.json (a missing or malformed publicKey is a schema-violation)
        "401":
          description: Missing or invalid enrollment code
  /api/link/v1/challenge:
    post:
      operationId: postChallenge
      summary: Request a single-use nonce to sign a proof of possession against
      description: |
        Unauthenticated by design: a challenge proves nothing, so it cannot be
        guarded by what it is issuing. An unknown `endpointId` gets the same
        401 as a wrong proof — no existence oracle. The nonce is single-use and
        expires after `Link:ChallengeLifetimeSeconds`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [endpointId]
              properties:
                endpointId:
                  $ref: "../json-schema/common.v1.json#/$defs/idToken"
      responses:
        "200":
          description: Nonce issued
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [nonce, publicKeyRequired, algorithm, expiresAt]
                properties:
                  nonce:
                    type: string
                    minLength: 16
                    maxLength: 128
                  publicKeyRequired:
                    type: boolean
                  algorithm:
                    type: string
                    enum: [ed25519]
                  expiresAt:
                    type: string
                    format: date-time
        "401":
          description: Unknown endpointId or unenrolled endpoint (no existence oracle)
  /api/link/v1/proof:
    post:
      operationId: postProof
      summary: Exchange a detached EdDSA proof of possession for a session JWT
      description: |
        The proof is a detached JWS (RFC 8037 subset, `alg: EdDSA`,
        `typ: ofac-proof+jwt`) whose payload carries
        `{iss, sub, jti, htm, htu, iat, nbf, exp, nonce, seq, epoch, cbh}` with
        `htm = "POST"` and `htu = /api/link/v1/proof`. Every check fails closed:
        signature by the enrollment's ACTIVE key, htm/htu match, clock inside
        the configured skew, nonce present-and-unconsumed, `jti` unseen, `seq`
        at or above the stored fence, `epoch` equal to the row's revocation
        epoch, and a non-empty `cbh` when channel binding is required.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [proof]
              properties:
                proof:
                  type: string
                  minLength: 1
                  maxLength: 8192
      responses:
        "200":
          description: Session minted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [sessionToken, expiresAt, seq]
                properties:
                  sessionToken:
                    type: string
                    minLength: 1
                    maxLength: 8192
                  expiresAt:
                    type: string
                    format: date-time
                  seq:
                    type: integer
                    minimum: 0
        "401":
          description: proof-invalid, replay-suspect or key-rotation-grace-expired
  /api/link/v1/enroll/{endpointId}/rotate:
    post:
      operationId: postKeyRotation
      summary: Swap this endpoint's active key under proof by both keys
      description: |
        Arrives under the ordinary link auth path (a valid session JWT issued by
        the current active key). `proofs` is exactly two detached JWSs, both
        signing the SAME payload `{oldKid, newKid, nonce, seq}` — one by the old
        key, one by the new — which is what makes the swap a mutual agreement
        rather than a takeover. A proof by a key retired less than
        `Link:RotateGraceMinutes` ago is accepted against a fresh challenge and
        audits `link.rotate-grace-consumed`; the grace never authorizes a first
        key. Outside the grace: 401, revoke-and-rejoin. `epoch` is untouched.
      parameters:
        - name: endpointId
          in: path
          required: true
          schema:
            $ref: "../json-schema/common.v1.json#/$defs/idToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [oldKeyId, newPublicKey, proofs]
              properties:
                oldKeyId:
                  type: string
                  pattern: "^sha256:[0-9a-f]{64}$"
                newPublicKey:
                  type: string
                  pattern: "^[A-Za-z0-9_-]{43,44}$"
                  minLength: 43
                  maxLength: 44
                proofs:
                  type: array
                  minItems: 2
                  maxItems: 2
                  items:
                    type: string
                    minLength: 1
                    maxLength: 8192
      responses:
        "204":
          description: Key swapped (link.key-rotated audited with both fingerprints)
        "400":
          description: Body violates the rotation shape (fewer than two proofs is a schema-violation)
        "401":
          description: Missing or invalid bearer principal, or key-rotation-grace-expired
  /api/link/v1/events:
    post:
      operationId: postEvent
      summary: Submit a CloudEvents envelope (equivalent to the SignalR Envelope method)
      description: |
        Receiver persists the inbox row before returning `accepted`.
        Duplicate `(source, id)` or `commandId` replays return
        a `duplicate` receipt without re-applying the command. Unknown command
        types fail closed with an `unsupported` receipt.
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: "../cloudevents-schemas/envelope.json"
      responses:
        "202":
          description: Admission decision (receipt — inbox admission, not work completion)
          content:
            application/json:
              schema:
                $ref: "../json-schema/receipt.v1.json"
        "401":
          description: Missing or invalid bearer principal
        "413":
          description: Serialized envelope exceeds 262144 bytes
  /api/link/v1/deliveries:
    get:
      operationId: getDeliveries
      summary: Long-poll pending deliveries for the authenticated principal
      parameters:
        - name: wait
          in: query
          description: Long-poll wait in seconds (0 = immediate)
          schema:
            type: integer
            minimum: 0
            maximum: 60
        - name: limit
          in: query
          description: Maximum deliveries returned per call (bounded by maxInFlight)
          schema:
            type: integer
            minimum: 1
            maximum: 64
      responses:
        "200":
          description: Pending deliveries (may be empty on poll timeout)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Delivery"
        "401":
          description: Missing or invalid bearer principal
  /api/link/v1/deliveries/{deliveryId}/receipt:
    post:
      operationId: postReceipt
      summary: Acknowledge a delivered envelope with a receipt
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptWithoutDeliveryId"
      responses:
        "204":
          description: Receipt recorded against the delivery ledger
        "401":
          description: Missing or invalid bearer principal
        "404":
          description: Unknown deliveryId
  /api/link/v1/artifacts/{artifactId}/content:
    get:
      operationId: getArtifactContent
      summary: Read one artifact's content from the workload plane
      description: |
        Guard: the link bearer token plus row team ownership in the artifact
        ledger — a foreign-team or missing row answers 404 (non-disclosure).
        Object-store backends answer 302 to a presigned GET (portable
        retrieval); other backends stream the bytes with the declared
        media type and the digest as the entity tag. A row in `pending` state,
        or one whose blob is gone, answers 404.
      parameters:
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Artifact bytes (content-type as declared at upload)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "302":
          description: Redirect to the object store's presigned GET URL
        "401":
          description: Missing or invalid bearer principal
        "404":
          description: Unknown, foreign-team, non-stored, or blobless artifact
  /api/link/v1/capabilities:
    get:
      operationId: getCapabilities
      summary: The endpoint's advertised CapabilityManifest
      responses:
        "200":
          description: Capability manifest
          content:
            application/json:
              schema:
                $ref: "../json-schema/capability-manifest.v1.json"
        "401":
          description: Missing or invalid bearer principal
    post:
      operationId: postCapabilities
      summary: Advertise the endpoint's CapabilityManifest
      description: |
        Stores the manifest against the caller's enrollment; `ownerTeam` MUST
        equal the authenticated principal's team. The body validates against
        capability-manifest.v1.json.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../json-schema/capability-manifest.v1.json"
      responses:
        "204":
          description: Manifest stored
        "400":
          description: Body violates capability-manifest.v1.json
        "401":
          description: Missing or invalid bearer principal
        "403":
          description: ownerTeam does not match the authenticated principal's team
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Kernel-signed EdDSA session JWT (5 minutes by default, `Link:SessionTokenLifetimeSeconds`) obtained by proving possession of the endpoint's enrolled public key; every replica verifies it from the shared kernel session key, and the `epoch` claim makes revocation effective inside the token's remaining lifetime without a session table.
  schemas:
    EnrollRequest:
      $ref: "../json-schema/enroll-request.v1.json"
    EnrollResponse:
      $ref: "../json-schema/enroll-response.v1.json"
    Delivery:
      $ref: "../cloudevents-schemas/link-delivery.v1.json"
    ReceiptWithoutDeliveryId:
      description: >
        receipt.v1 without deliveryId — the delivery identity travels in the
        path. `processedAt` is required for accepted|duplicate and `reason`
        for rejected|unsupported, as in the full receipt schema.
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted, duplicate, rejected, unsupported]
        processedAt:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 1
          maxLength: 4096
        detail:
          type: object
