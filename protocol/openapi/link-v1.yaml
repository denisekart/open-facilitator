openapi: 3.1.0
info:
  title: Open Facilitator — Workspace Link HTTP surface (v1)
  version: 1.0.2
  description: |
    Provider-neutral HTTP fallback for the Workspace Link contract.
    SignalR is the default reference transport; these endpoints carry identical
    application semantics and MUST pass the same conformance suite
    (protocol/conformance-fixtures/).

    Wire limits: the full serialized CloudEvents envelope MUST NOT exceed
    262144 bytes (256 KiB; the fixture index `limits.maxEnvelopeBytes` is the
    single source of truth). Artifacts never travel inline — they move through
    scoped artifact storage and are referenced by digest
    (components ArtifactRefV1).

    Authentication: bearer workload token (short-lived OIDC/mTLS-anchored
    principal); the authenticated principal — not a JSON field —
    determines allowed team/Gateway/workspace identity.

    Served by the kernel Link server; the admin surface mirror lives in
    admin-v1.yaml.

    1.0.1 rationale (additive minor change): EnrollResponse gains the optional
    `linkToken` and `expiresAt` properties — the interim per-endpoint bearer
    credential the Link server issues at enrollment — and
    `POST /api/link/v1/capabilities` is added so an endpoint can advertise its
    CapabilityManifest over the HTTP surface. No existing field changed
    meaning or requiredness, so per semver/OpenAPI additive-change
    conventions the minor bump is the only compatibility action required.
    EnrollRequest / EnrollResponse / Delivery are now $refs to their
    single-source-of-truth JSON Schema files (the precedent set by the events
    path above); Delivery sits beside the envelope schema it embeds, under
    protocol/cloudevents-schemas/.

    1.0.2 rationale (additive minor change): EnrollRequest gains the optional
    `role` (enum gateway|child) and `team` (idToken) properties — the workload
    role and team roster slug a kernel binds at enrollment — and the
    shared `evidenceRef` bound loosens from 256 to 2048 characters so an
    inline `oidc:<jwt>` delegation evidence reference fits (every value valid
    under 1.0.1 stays valid). No existing field changed meaning or
    requiredness, so per the 1.0.1 precedent the minor bump is the only
    compatibility action required.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/link/v1/enroll:
    post:
      operationId: enroll
      summary: Bootstrap enrollment for a Gateway/Workspace Link endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollRequest"
      responses:
        "201":
          description: Enrollment accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollResponse"
        "401":
          description: Missing or invalid bearer principal
  /api/link/v1/events:
    post:
      operationId: postEvent
      summary: Submit a CloudEvents envelope (equivalent to the SignalR Envelope method)
      description: |
        Receiver persists the inbox row before returning `accepted`.
        Duplicate `(source, id)` or `commandId` replays return
        a `duplicate` receipt without re-applying the command. Unknown command
        types fail closed with an `unsupported` receipt.
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: "../cloudevents-schemas/envelope.json"
      responses:
        "202":
          description: Admission decision (receipt — inbox admission, not work completion)
          content:
            application/json:
              schema:
                $ref: "../json-schema/receipt.v1.json"
        "401":
          description: Missing or invalid bearer principal
        "413":
          description: Serialized envelope exceeds 262144 bytes
  /api/link/v1/deliveries:
    get:
      operationId: getDeliveries
      summary: Long-poll pending deliveries for the authenticated principal
      parameters:
        - name: wait
          in: query
          description: Long-poll wait in seconds (0 = immediate)
          schema:
            type: integer
            minimum: 0
            maximum: 60
        - name: limit
          in: query
          description: Maximum deliveries returned per call (bounded by maxInFlight)
          schema:
            type: integer
            minimum: 1
            maximum: 64
      responses:
        "200":
          description: Pending deliveries (may be empty on poll timeout)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Delivery"
        "401":
          description: Missing or invalid bearer principal
  /api/link/v1/deliveries/{deliveryId}/receipt:
    post:
      operationId: postReceipt
      summary: Acknowledge a delivered envelope with a receipt
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptWithoutDeliveryId"
      responses:
        "204":
          description: Receipt recorded against the delivery ledger
        "401":
          description: Missing or invalid bearer principal
        "404":
          description: Unknown deliveryId
  /api/link/v1/capabilities:
    get:
      operationId: getCapabilities
      summary: The endpoint's advertised CapabilityManifest
      responses:
        "200":
          description: Capability manifest
          content:
            application/json:
              schema:
                $ref: "../json-schema/capability-manifest.v1.json"
        "401":
          description: Missing or invalid bearer principal
    post:
      operationId: postCapabilities
      summary: Advertise the endpoint's CapabilityManifest
      description: |
        Stores the manifest against the caller's enrollment; `ownerTeam` MUST
        equal the authenticated principal's team. The body validates against
        capability-manifest.v1.json.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../json-schema/capability-manifest.v1.json"
      responses:
        "204":
          description: Manifest stored
        "400":
          description: Body violates capability-manifest.v1.json
        "401":
          description: Missing or invalid bearer principal
        "403":
          description: ownerTeam does not match the authenticated principal's team
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer workload token; issuer/audience/claims validation is pinned by the kernel's OIDC identity configuration.
  schemas:
    EnrollRequest:
      $ref: "../json-schema/enroll-request.v1.json"
    EnrollResponse:
      $ref: "../json-schema/enroll-response.v1.json"
    Delivery:
      $ref: "../cloudevents-schemas/link-delivery.v1.json"
    ReceiptWithoutDeliveryId:
      description: >
        receipt.v1 without deliveryId — the delivery identity travels in the
        path. `processedAt` is required for accepted|duplicate and `reason`
        for rejected|unsupported, as in the full receipt schema.
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted, duplicate, rejected, unsupported]
        processedAt:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 1
          maxLength: 4096
        detail:
          type: object
