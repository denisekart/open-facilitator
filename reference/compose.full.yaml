# Full overlay: the provider services on top of the slim stack.
# Bring up: make compose-full. Gateway/launcher/worker services land with the
# node-runtime compose services.
services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:${FORGEJO_TAG:?set in versions.env}
    environment:
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__ROOT_URL: http://git.localhost:3000/
      # Headless bootstrap (Plan 23): without the lock the image serves only
      # the install wizard, so forgejo-init's first-admin signup 404s. Locked
      # + zero users = installed instance with open signup; Gitea's
      # CheckAdminPrivilege law promotes the first anonymous signup to admin.
      FORGEJO__security__INSTALL_LOCK: "true"
      # 16.x webhooks are SSRF-filtered (default allowlist: loopback only) —
      # the hook may dial the kernel sink, nothing else: the facilitator is
      # the only web-exposed point, and the sink fans the verbatim delivery
      # to the adapter over the link plane (provider-set plan 1.4).
      FORGEJO__webhook__ALLOWED_HOST_LIST: facilitator
    volumes:
      - forgejo_data:/data
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      default:
        aliases: [git.localhost]

  mattermost:
    image: mattermost/mattermost-team-edition:${MATTERMOST_TAG:?set in versions.env}
    # Official image ships amd64 only; the platform pin lets arm64 hosts boot
    # the overlay under emulation.
    platform: linux/amd64
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://demo:${DEMO_POSTGRES_PASSWORD:?set in .env}@postgres:5432/mattermost?sslmode=disable
      MM_SERVICESETTINGS_SITEURL: http://chat.localhost:8065
      # Bootstrap law (Plan 22): 11.x has no unauthenticated setup route and
      # local-mode CLI is off by default, so the admin is created over OPEN
      # SIGNUP (a fresh server admits the first account unauthenticated ⇒
      # sysadmin) and email verification stays off so that account can log in
      # immediately. 11.x law: EnableOpenServer lives under TeamSettings
      # (the ServiceSettings key was removed); the e2e tier's guest signups
      # need it true.
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "true"
      MM_EMAILSETTINGS_REQUIREEMAILVERIFICATION: "false"
      # 11.x TE ships bot-account creation DISABLED (api.bot.create_disabled
      # 403); the adapter's identity is a bot, so the one-shot needs it on.
      MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: "true"
    volumes:
      - mattermost_data:/mattermost/data
    ports:
      - "127.0.0.1:8065:8065"
    networks:
      default:
        aliases: [chat.localhost]
    depends_on:
      postgres:
        condition: service_healthy
    # Image default healthcheck (mmctl --local): the TE image is UBI-micro,
    # no shell, so no custom probe is possible. Nothing gates on it — the
    # init one-shot polls /system/ping itself.

  # Provisioning one-shot (Plan 22 step 4): admin + bot + PAT + team over
  # REST, then publishes the bot token to a shared volume for the adapter
  # (MATTERMOST_BOT_TOKEN_FILE) and the kernel (Providers:Mattermost:
  # BotTokenFile). Exits 0 when done. Runs on node-runtime, NOT the TE image:
  # UBI-micro carries no shell for a provisioning script.
  mattermost-init:
    image: ${OCI_REGISTRY:?set in versions.env}/node-runtime:${FRAMEWORK_TAG:?set in versions.env}
    entrypoint: ["node", "/opt/ofac/mm-init.mjs"]
    environment:
      MM_ADMIN_PASSWORD: ${DEMO_MM_ADMIN_PASSWORD:?set in .env}
    volumes:
      - ./bootstrap/mm-init.mjs:/opt/ofac/mm-init.mjs:ro
      - mm_provision:/provision
    depends_on:
      mattermost:
        condition: service_started

  # Provider ingest adapter (Plan 22): link-plane endpoint dials out to the
  # kernel; inbound trust is the bot WebSocket credential (D1 — no webhook
  # inbound contract). PORT only serves GET /healthz, published loopback for
  # the e2e probe.
  mattermost-adapter:
    image: ${OCI_REGISTRY:?set in versions.env}/node-runtime:${FRAMEWORK_TAG:?set in versions.env}
    command: ["node", "/app/mattermost-adapter/dist/bin/adapter.js", "run"]
    environment:
      OFAC_KERNEL_URL: http://facilitator:8080
      OFAC_ENROLL_SECRET: ${DEMO_ENROLLMENT_TOKEN:?set in .env}
      OFAC_ENDPOINT_ID: mm-adapter
      OFAC_TEAM: team-alpha
      # Site-host alias (same origin the browser sees): the adapter's tenant
      # is derived from this URL's hostname, so the kernel's Providers:
      # Mattermost:Tenant must read chat.localhost.
      MATTERMOST_URL: http://chat.localhost:8065
      MATTERMOST_BOT_TOKEN_FILE: /provision/mm-bot-token
      OFAC_STATE_PATH: /var/lib/ofac/mm-adapter.sqlite3
      PORT: "8066"
    volumes:
      - mm_provision:/provision:ro
      - mm_adapter_state:/var/lib/ofac
    ports:
      - "127.0.0.1:8066:8066"
    depends_on:
      mattermost-init:
        condition: service_completed_successfully
      facilitator:
        condition: service_healthy
    # Enrollment is the adapter's first fetch; a still-migrating kernel must
    # not kill the service permanently (healthy gate + bounded restart).
    restart: on-failure:5

  # Telegram leg: opt-in behind the `telegram` compose profile (a real
  # @BotFather token is a manual prerequisite — see reference/README.md;
  # TELEGRAM_CHATS lists the admitted group ids with their routing labels).
  # One poll-mode instance per bot token: two replicas would fight over
  # getUpdates. No port except /healthz in poll mode.
  tg-adapter:
    profiles: ["telegram"]
    image: ${OCI_REGISTRY:?set in versions.env}/node-runtime:${FRAMEWORK_TAG:?set in versions.env}
    command: ["node", "/app/telegram-adapter/dist/bin/adapter.js", "run"]
    environment:
      OFAC_KERNEL_URL: http://facilitator:8080
      OFAC_ENROLL_SECRET: ${DEMO_ENROLLMENT_TOKEN:?set in .env}
      OFAC_ENDPOINT_ID: tg-adapter
      OFAC_TEAM: team-alpha
      TELEGRAM_BOT_TOKEN_FILE: /provision/telegram-bot-token
      # No `:?`: compose interpolates profile-inactive services too, and a
      # plain full up must not fail because an opt-in leg lacks its vars —
      # the adapter itself fails closed (exit 2) when a telegram profile up
      # comes without TELEGRAM_CHATS.
      TELEGRAM_CHATS: ${TELEGRAM_CHATS:-}
      TELEGRAM_MODE: poll
      OFAC_STATE_PATH: /var/lib/ofac/tg-adapter.sqlite3
      PORT: "8078"
    volumes:
      - tg_provision:/provision:ro
      - tg_adapter_state:/var/lib/ofac
    ports:
      - "127.0.0.1:8078:8078"
    depends_on:
      facilitator:
        condition: service_healthy
    restart: on-failure:5

  # Kernel provider wiring (Plan 22, decision 2): env-scoped to the full
  # profile so the slim stack boots provider-less from the shared
  # facilitator.json. The bot id is resolved lazily via the configured probe
  # URL (BotIdentityProbeUrl) with the provisioned PAT (provider-generated,
  # unpinnable); the unlinked-mention hint copy is provider data too.
  # ONE env source shared with the replica twin (compose.replicas.full.yaml
  # loads the SAME providers file): `extends` resolves against
  # compose.slim.yaml only, so an inline env block here would leave the twin
  # provider-less and a webhook whose adapter session rides replica B would
  # get a typed `unsupported` receipt.
  facilitator:
    env_file:
      - config/facilitator.env
      - config/facilitator-providers.env
    volumes:
      - mm_provision:/provision:ro
    depends_on:
      mattermost-init:
        condition: service_completed_successfully
      forgejo-init:
        condition: service_completed_successfully

  # ── Plan 23: forgejo provider plane (mirror of the mattermost block) ────
  # Bootstrap one-shot: first-admin signup (no anonymous admin-REST route on
  # 16.x — the plan's contingency: signup form while INSTALL_LOCK is set and
  # zero users exist), bot account + repo write, org/repo/label/sample-issue,
  # webhook registration at the kernel sink, bot PAT published to
  # forgejo_provision (0444-atomic, mm-init law). Exits 0 when done.
  forgejo-init:
    image: ${OCI_REGISTRY:?set in versions.env}/node-runtime:${FRAMEWORK_TAG:?set in versions.env}
    command: ["node", "/app/forgejo-adapter/dist/bin/adapter.js", "init"]
    environment:
      OFAC_KERNEL_URL: http://facilitator:8080
      OFAC_ENROLL_SECRET: ${DEMO_ENROLLMENT_TOKEN:?set in .env}
      OFAC_ENDPOINT_ID: forgejo-adapter
      OFAC_TEAM: team-alpha
      FORGEJO_URL: http://git.localhost:3000
      FORGEJO_TOKEN_FILE: /provision/forgejo-bot-token
      FORGEJO_WEBHOOK_SECRET: ${DEMO_FORGEJO_WEBHOOK_SECRET:?set in .env}
      FORGEJO_BOT_USER: facilitator-bot
      DEMO_FORGEJO_ADMIN_PASSWORD: ${DEMO_FORGEJO_ADMIN_PASSWORD:?set in .env}
      # Coding-lane seed: second sample issue + its label (same reconcile
      # law). The label lands as the admin (not the bot), so the labeled
      # webhook is NOT echo-dropped: bootstrap itself arms the coding Work
      # and the e2e leg polls the chain rather than driving it.
      FORGEJO_INIT_CODING_ISSUE_TITLE: "Seed: add a changelog entry"
      FORGEJO_INIT_CODING_LABEL: ofac:coding
    volumes:
      - forgejo_provision:/provision
    depends_on:
      forgejo:
        condition: service_started
    # Forgejo's first boot runs migrations for a while; the one-shot polls
    # readiness itself, but a crash mid-bootstrap must not stay crashed.
    restart: on-failure:5

  # Provider ingest adapter (Plan 23): webhook HMAC in, link-plane endpoint
  # out. /healthz published loopback for the e2e probe; the forge's webhook
  # targets the kernel sink (init registers that exact URL, fan-out rides links).
  forgejo-adapter:
    image: ${OCI_REGISTRY:?set in versions.env}/node-runtime:${FRAMEWORK_TAG:?set in versions.env}
    command: ["node", "/app/forgejo-adapter/dist/bin/adapter.js", "run"]
    environment:
      OFAC_KERNEL_URL: http://facilitator:8080
      OFAC_ENROLL_SECRET: ${DEMO_ENROLLMENT_TOKEN:?set in .env}
      OFAC_ENDPOINT_ID: forgejo-adapter
      OFAC_TEAM: team-alpha
      # Site-host alias (same origin the browser sees): the adapter's tenant
      # is this URL's hostname, so the kernel's Providers:Forgejo:Tenant must
      # read git.localhost.
      FORGEJO_URL: http://git.localhost:3000
      FORGEJO_TOKEN_FILE: /provision/forgejo-bot-token
      FORGEJO_WEBHOOK_SECRET: ${DEMO_FORGEJO_WEBHOOK_SECRET:?set in .env}
      FORGEJO_BOT_USER: facilitator-bot
      # Echo suppression + Work-trigger policy cover both lanes: a human
      # labeling an issue ofac:coding arms a coding Work.
      FORGEJO_WORK_LABELS: ofac:work,ofac:coding
      OFAC_STATE_PATH: /var/lib/ofac/forgejo-adapter.sqlite3
      PORT: "8067"
    volumes:
      - forgejo_provision:/provision:ro
      - forgejo_adapter_state:/var/lib/ofac
    ports:
      - "127.0.0.1:8067:8067"
    depends_on:
      forgejo-init:
        condition: service_completed_successfully
      facilitator:
        condition: service_healthy
    restart: on-failure:5
  # Ops connector (Plan 23, decision 8): runs as a supervisor unit inside
  # demo-workspace, attaches to the Gateway over the child socket. Env opt-in
  # (the 40- unit exits 0 without FORGEJO_URL — slim never sets it). The bot
  # token file lands from forgejo-init via the shared volume; the overlay
  # gates startup on init completion so the read never races.
  demo-workspace:
    environment:
      FORGEJO_URL: http://forgejo:3000
      FORGEJO_TOKEN_FILE: /provision/forgejo-bot-token
      FORGEJO_ENABLE_ISSUES: "true"
      FORGEJO_ENABLE_VCS: "true"
      FORGEJO_ENABLE_MRS: "true"
      FORGEJO_ENABLE_PIPELINE: "true"
    volumes:
      - workspace_state:/var/lib/ofac
      - ../features/shared/ofac-supervisor.sh:/opt/ofac/ofac-supervisor.sh:ro
      - ./container/units:/opt/ofac/units:ro
      - ./config/workspace:/opt/ofac/config:ro
      - forgejo_provision:/provision:ro
    depends_on:
      facilitator:
        condition: service_healthy
      forgejo-init:
        condition: service_completed_successfully

  # Team-coding's own workspace container: Gateway gw.coding + the coding
  # worker + a second forgejo connector instance (own sqlite ledger, shared
  # bot PAT via the provision volume). A full-profile service: the coding
  # lane exists only when the forgejo provider does. Mode-(a) enrollment
  # (shared Link__EnrollmentToken), own child-wire fleet secret; the worker
  # self-enrolls coding-worker-child@team-coding for the artifact byte path.
  # Units copy law: ./container/coding-units mirrors ./container/units.
  coding-workspace:
    image: ${OCI_REGISTRY:?set in versions.env}/node-runtime:${FRAMEWORK_TAG:?set in versions.env}
    entrypoint: ["/bin/sh", "/opt/ofac/ofac-supervisor.sh"]
    environment:
      UNITS_DIR: /opt/ofac/units
      OFAC_LOG_DIR: /var/lib/ofac/logs
      GATEWAY_CONFIG: /opt/ofac/config/gateway.yaml
      WORKER_CONFIG: /opt/ofac/config/worker.yaml
      OFAC_ENROLL_SECRET: ${DEMO_ENROLLMENT_TOKEN:?set in .env}
      OFAC_KERNEL_URL: http://facilitator:8080
      OFAC_WORKER_TEAM: team-coding
      OFAC_WORKER_ENDPOINT: coding-worker-child
      OFAC_CHILD_SECRET: ${CODING_CHILD_SECRET:?set in .env}
      # The connector unit (40-) keys off FORGEJO_URL; the worker's git lane
      # reads the same pair (PAT per-run from the provisioned token file).
      FORGEJO_URL: http://forgejo:3000
      FORGEJO_TOKEN_FILE: /provision/forgejo-bot-token
      FORGEJO_ENABLE_ISSUES: "true"
      FORGEJO_ENABLE_VCS: "true"
      FORGEJO_ENABLE_MRS: "true"
    volumes:
      - coding_workspace_state:/var/lib/ofac
      - ../features/shared/ofac-supervisor.sh:/opt/ofac/ofac-supervisor.sh:ro
      - ./container/coding-units:/opt/ofac/units:ro
      - ./config/coding-workspace:/opt/ofac/config:ro
      - forgejo_provision:/provision:ro
    depends_on:
      facilitator:
        condition: service_healthy
      forgejo-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8100/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  kafka:
    image: apache/kafka:${KAFKA_TAG:?set in versions.env}
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports:
      - "127.0.0.1:9092:9092"

  ollama:
    image: ollama/ollama:${OLLAMA_TAG:?set in versions.env}
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

volumes:
  forgejo_data: {}
  mattermost_data: {}
  # Bot-token handoff: mm-init (writer) → adapter + kernel (readers).
  mm_provision: {}
  # Adapter sqlite ledger (deliveries + post idempotency + replay cursor).
  mm_adapter_state: {}
  # Forgejo bot-token handoff (init writes → adapter + connector read) and
  # the adapter's sqlite delivery ledger.
  forgejo_provision: {}
  forgejo_adapter_state: {}
  # Telegram: the bot-token handoff (written by the operator after
  # @BotFather) and the adapter's sqlite ledgers (chat state + media dedupe).
  tg_provision: {}
  tg_adapter_state: {}
  ollama_models: {}
  # Coding fleet's state: gateway ledger, worker workdirs, the second
  # connector's sqlite ledger.
  coding_workspace_state: {}
