# Plan 35 Phase C overlay (slim + full): the provisioning plane. The kernel's
# ProvisioningProcessor holds the scale law; the oci-launcher executes it
# against the host Docker socket; the elastic-worker IMAGE is the workload it
# manages (never a compose service — compose would mask the law). The demo
# env is the launch-approved surface: exactly this image, exactly this
# network.
services:
  # The kernel's provisioning arm (Provision__* + the 5s heartbeat timing
  # law) lives in config/facilitator.env — the ONE facilitator env source
  # shared verbatim by the primary and the Phase D replica twin, so a twin
  # can never drift from its primary. Every live bring-up path loads this
  # overlay, so it is the right home for the block.
  facilitator: {}
  # No depends_on the launcher: an unstarted launcher just means provision
  # commands queue undelivered (the honest link-plane law); a depends edge
  # would cycle (the launcher already depends on the kernel).

  # The launcher: link endpoint `oci-launcher`, Docker Engine over the
  # host's unix socket. It launches ONLY allowlisted images onto allowlisted
  # networks; the env VALUES its workloads carry are expanded from THIS
  # container's env (name-indirection law), hence the two demo literals ride
  # in here as themselves.
  provisioning-launcher:
    image: ${OCI_REGISTRY:?set in versions.env}/node-runtime:${FRAMEWORK_TAG:?set in versions.env}
    # The Engine socket is root:docker on the host and node-runtime's
    # non-root user carries neither — this container rides root (it is a
    # thin socket proxy; the containers IT creates run as the workload
    # image's own user).
    user: root
    command: ["node", "/app/provisioning-oci/dist/bin/launcher.js", "run", "--config", "/opt/ofac/config/adapter.yaml"]
    environment:
      OFAC_ENROLL_SECRET: ${DEMO_ENROLLMENT_TOKEN:?set in .env}
      OFAC_ENDPOINT_ID: oci-launcher
      OFAC_TEAM: team-alpha
      DOCKER_HOST: unix:///var/run/docker.sock
      OFAC_STATE_PATH: /var/lib/ofac/oci-launcher.sqlite3
      OFAC_PROV_ALLOWED_IMAGES: ${OCI_REGISTRY:?set in versions.env}/elastic-worker:${FRAMEWORK_TAG:?set in versions.env}
      OFAC_PROV_ALLOWED_NETWORKS: facilitator-demo_default
      # The workload spec's $-names resolve against THIS env.
      DEMO_ENROLLMENT_TOKEN: ${DEMO_ENROLLMENT_TOKEN:?set in .env}
      DEMO_CHILD_SECRET: ${DEMO_CHILD_SECRET:?set in .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - launcher_state:/var/lib/ofac
      - ./config/launcher:/opt/ofac/config:ro
    depends_on:
      facilitator:
        condition: service_healthy
    restart: on-failure:5

  # The managed workload's IMAGE (built, never `up`ed — the kernel launches
  # containers from it). Same node-runtime + the elastic config/supervisor/
  # units baked in; state on the container layer: a relaunched gateway
  # re-registers (the law the kill-9 leg exercises).
  elastic-worker:
    build:
      context: ..
      dockerfile: reference/container/Dockerfile.elastic
      args:
        OFAC_REGISTRY: ${OCI_REGISTRY:?set in versions.env}
        OFAC_TAG: ${FRAMEWORK_TAG:?set in versions.env}
    image: ${OCI_REGISTRY:?set in versions.env}/elastic-worker:${FRAMEWORK_TAG:?set in versions.env}
    profiles: [build-only]

volumes:
  launcher_state: {}
