# Kernel LB (Plan 35 D): least_conn over the two replicas with passive
# eviction (max_fails) — a killed replica's refused connects take it out of
# rotation, the gateway reconnect lands on the survivor. WS legs ride the
# Upgrade/Connection headers (SignalR skipNegotiation, no backplane).
worker_processes 1;
events { worker_connections 1024; }
http {
    # Docker's embedded DNS: the per-replica probe locations below re-resolve
    # per request (a variable proxy_pass is resolver-driven), so a stale
    # upstream IP surfaces as an unhealthy LB even while the other replica
    # keeps answering /.
    resolver 127.0.0.11 valid=5s ipv6=off;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    upstream kernel {
        least_conn;
        # `resolve` needs the zone (shared memory for the live address set).
        zone kernel 64k;
        # `resolve` + the resolver above: nginx re-resolves each server every
        # valid= window, so a replica RECREATED while the LB runs (new IP)
        # is picked up without restarting the LB — a boot-time-only DNS
        # resolution pins the stale IP, every sample to it times out,
        # max_fails marks the replica down, and the whole fleet silently
        # runs on one replica (the exact failure the first matrix run hit).
        server facilitator:8080 max_fails=1 fail_timeout=30s resolve;
        server facilitator-b:8080 max_fails=1 fail_timeout=30s resolve;
    }
    server {
        listen 80;
        client_max_body_size 16m;
        location = /nginx-health { return 200; }
        location = /upstream-a { set $u http://facilitator:8080/health;   proxy_pass $u; proxy_connect_timeout 2s; }
        location = /upstream-b { set $u http://facilitator-b:8080/health; proxy_pass $u; proxy_connect_timeout 2s; }
        location / {
            proxy_pass http://kernel;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # A KILLED replica's IP stops answering ARP: connects HANG
            # instead of refusing, and the 60s default connect timeout
            # black-holes every LB client that least_conn still samples.
            # 2s bounds the exposure; next_upstream retries the survivor.
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_timeout 10s;
            proxy_next_upstream_tries 2;
        }
    }
}
