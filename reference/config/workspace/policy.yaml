# Demo team policy: analyze runs free, publish parks for a human confirm.
# First-match-wins, implicit final deny (docs/security.md "Team policy
# engine"). The confirm row matches the gateway workload caller (the assign
# rides the link plane with the workload's claims) AND names the team group
# as an eligible responder, so a team member (alice) can answer the approval
# via the kernel respond route; empty actorAnyOf would leave only the
# workload itself eligible.
owner: team-alpha
policies:
  - capability: research.publish
    resources: ["*"]
    actorAnyOf: ["workload:gw.team-alpha", "group:/teams/team-alpha"]
    effect: confirm
  - capability: research.analyze
    resources: ["*"]
    actorAnyOf: []
    effect: allow
  # Plan 23 forgejo ops (exact capability rows: the engine has no
  # capability glob). Reads and comments run free; anything that mutates
  # forge-visible state (push, PR create, CI trigger) parks for a human
  # confirm. actorAnyOf names the team group so a member (alice) can answer
  # the approval via the kernel respond route; the empty list on allow rows
  # means any authenticated caller (policy.ts actorMatches).
  - capability: forgejo.issue.read
    resources: ["*"]
    actorAnyOf: []
    effect: allow
  - capability: forgejo.issue.comment
    resources: ["*"]
    actorAnyOf: []
    effect: allow
  - capability: forgejo.pr.comment
    resources: ["*"]
    actorAnyOf: []
    effect: allow
  - capability: forgejo.vcs.branch.push
    resources: ["*"]
    actorAnyOf: ["workload:gw.team-alpha", "group:/teams/team-alpha"]
    effect: confirm
  - capability: forgejo.pr.create
    resources: ["*"]
    actorAnyOf: ["workload:gw.team-alpha", "group:/teams/team-alpha"]
    effect: confirm
  - capability: forgejo.ci.trigger
    resources: ["*"]
    actorAnyOf: ["workload:gw.team-alpha", "group:/teams/team-alpha"]
    effect: confirm
