<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Relay mark. The center dot is the kernel: persistent, it remembers.
    The arrows are work passing around it between teams; the amber dot is
    the work-item in flight. Work moves, the center remembers.
  -->
  <g fill="none" stroke="#14201C" stroke-width="3" stroke-linecap="round">
    <path d="M6.49 10.5 A 11 11 0 0 1 25.51 10.5"/>
    <path d="M25.51 21.5 A 11 11 0 0 1 6.49 21.5"/>
  </g>
  <path d="M25.51 10.5 l4.6 0.9 M25.51 10.5 l0.9 4.6" stroke="#14201C" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M6.49 21.5 l-4.6 -0.9 M6.49 21.5 l-0.9 -4.6" stroke="#14201C" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="16" cy="16" r="4.4" fill="#14201C"/>
  <circle cx="20.8" cy="5.6" r="2.8" fill="#D97A22"/>
</svg>
